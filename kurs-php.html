<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHP Backend | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#172554,#312e81);color:#e0e7ff;font-family:Segoe UI,sans-serif}.card{background:#ffffff14;backdrop-filter:blur(12px);border-radius:24px;padding:28px;margin:24px auto;max-width:1000px}.btn{padding:13px 18px;border:0;border-radius:14px;background:#818cf8;color:#111827;font-weight:700;cursor:pointer}.btn:disabled{cursor:not-allowed;opacity:.9}.selected{outline:3px solid #fff}.correct{background:#22c55e!important;color:#fff}.wrong{background:#ef4444!important;color:#fff}.progress-fill{height:100%;background:#818cf8;width:0;transition:width .5s}</style></head>
<body class="p-6"><main class="max-w-6xl mx-auto"><header class="text-center mb-12"><a href="mavjud-kurslar.html" class="text-indigo-300">← Kurslar</a><h1 class="text-5xl md:text-6xl font-extrabold text-indigo-300 mt-6">PHP BACKEND</h1><p class="text-xl mb-6">Server tomon dasturlash va ma’lumotlar bazasi</p><div class="h-5 bg-black/40 rounded-full overflow-hidden max-w-2xl mx-auto"><div id="progressFill" class="progress-fill"></div></div><p class="text-2xl mt-3">Bajarilishi: <span id="progressText">0%</span></p></header><div id="lessons"></div></main>
<script>
const lessons=[
{title:'1-dars: PHP bilan tanishuv',video:'OK_JCtrrv-c',text:'PHP sintaksisi, o‘zgaruvchilar, echo va serverda kod bajarilishini o‘rganing.',questions:[['PHP qayerda ishlaydi?',['Serverda','Faqat brauzerda','Printerda'],0],['PHP fayl kengaytmasi?',['.php','.html','.css'],0],['echo nima qiladi?',['Ma’lumot chiqaradi','Fayl o‘chiradi','Serverni to‘xtatadi'],0],['O‘zgaruvchi belgisi qaysi?',['$','$#','@'],0],['PHP kodi qaysi teg bilan yoziladi?',['<?php ?>','<php>','<code>'],0],['String nima?',['Matn','Butun son','Rasm'],0],['int qanday qiymat?',['Butun son','Matn','Havola'],0],['if nima uchun ishlatiladi?',['Shart tekshirish uchun','Rasm chizish uchun','Fayl yuklash uchun'],0],['Array nima?',['Qiymatlar to‘plami','Server','Brauzer'],0],['PHP kodini bajarish uchun nima kerak?',['PHP server muhiti','Faqat CSS','Printer'],0]]},
{title:'2-dars: Form va session',video:'6EukZBGEDwQ',text:'HTML formalaridan ma’lumot qabul qilish, GET/POST va session bilan ishlashni o‘rganing.',questions:[['POST nimaga ishlatiladi?',['Ma’lumot yuborishga','Rang tanlashga','Video ko‘rishga'],0],['GET ma’lumoti odatda qayerda ko‘rinadi?',['URL manzilida','Rasm ichida','CSS faylida'],0],['Session nima saqlaydi?',['Foydalanuvchi holatini','Faqat CSSni','Rasmni'],0],['Form action nimani bildiradi?',['Ma’lumot yuboriladigan manzilni','Parolni','Rangni'],0],['name atributi nima uchun kerak?',['Input nomini berish uchun','Rang berish uchun','Videoni ochish uchun'],0],['required nima qiladi?',['Maydonni majburiy qiladi','Maydonni yashiradi','Serverni o‘chiradi'],0],['session_start() nima qiladi?',['Sessionni ishga tushiradi','Formani yopadi','Bazani o‘chiradi'],0],['Cookie qayerda saqlanadi?',['Foydalanuvchi brauzerida','Faqat server kabelida','Printerda'],0],['Validation nima?',['Ma’lumotni tekshirish','Ma’lumotni yashirish','Rasm chizish'],0],['htmlspecialchars nima uchun ishlatiladi?',['HTML belgilarini xavfsiz chiqarish uchun','Video yuklash uchun','Parol topish uchun'],0]]},
{title:'3-dars: MySQL va CRUD',video:'7S_tz1z_5bA',text:'PHP orqali ma’lumotlar bazasiga ulanish va CRUD amallarini bajarishni o‘rganing.',questions:[['CRUD dagi C nimani anglatadi?',['Create','Color','Copy'],0],['SQL nima uchun kerak?',['Ma’lumotlar bazasi bilan ishlash uchun','Video montaj uchun','Dizayn uchun'],0],['SELECT nima qiladi?',['Ma’lumot o‘qiydi','Ma’lumot o‘chiradi','Serverni yopadi'],0],['INSERT nima qiladi?',['Yangi ma’lumot qo‘shadi','Ma’lumotni yashiradi','Rangni o‘zgartiradi'],0],['UPDATE nima qiladi?',['Ma’lumotni yangilaydi','Bazani o‘chiradi','Faylni yuklaydi'],0],['DELETE nima qiladi?',['Ma’lumotni o‘chiradi','Ma’lumot qo‘shadi','Jadval yaratadi'],0],['Table nima?',['Ma’lumotlar jadvali','Parol','Brauzer'],0],['Primary key nima?',['Qatorning noyob kaliti','CSS rangi','Video manzili'],0],['PDO nima uchun ishlatiladi?',['PHP ni bazaga ulash uchun','HTML bezash uchun','Rasm chizish uchun'],0],['SQL injectiondan himoya usuli qaysi?',['Prepared statement','Parolni ochiq yozish','Tekshirmasdan so‘rov yuborish'],0]]}];
const key='php_progress',progress=JSON.parse(localStorage.getItem(key)||'[]'),answers={};
const box=document.getElementById('lessons');
function render(){box.innerHTML='';lessons.forEach((l,i)=>{const open=i===0||progress.includes(i-1),d=document.createElement('section');d.className='card';d.innerHTML=`<h2 class="text-3xl font-bold mb-5 text-indigo-300">${open?'▶':'🔒'} ${l.title}</h2>${open?`<iframe src="https://www.youtube.com/embed/${l.video}" class="w-full h-72 rounded-2xl mb-6" allowfullscreen></iframe><p class="text-lg mb-8">${l.text}</p><div id="quiz-${i}" class="space-y-5">${l.questions.map((q,j)=>`<div class="bg-white/10 p-5 rounded-2xl"><p class="font-bold text-xl mb-4">${j+1}. ${q[0]}</p><div class="grid md:grid-cols-3 gap-3">${q[1].map((a,k)=>`<button class="btn" data-q="${j}" onclick="choose(${i},${j},${k})">${a}</button>`).join('')}</div></div>`).join('')}</div><div class="flex flex-wrap gap-3 mt-8"><button class="bg-green-500 text-black font-bold px-8 py-4 rounded-xl" onclick="check(${i})">JAVOBNI TEKSHIRISH</button><button id="retry-${i}" class="hidden bg-yellow-400 text-black font-bold px-8 py-4 rounded-xl" onclick="retry(${i})">QAYTA URINISH</button></div><p id="result-${i}" class="mt-5 text-2xl font-bold"></p>`:'<div class="text-center py-20 text-2xl opacity-60">Bu dars oldingi dars tugagandan keyin ochiladi.</div>'}`;box.appendChild(d)})}function choose(l,q,a){(answers[l]??=[])[q]=a;document.querySelectorAll(`#quiz-${l} [data-q="${q}"]`).forEach((b,i)=>b.classList.toggle('selected',i===a))}function check(i){if(!answers[i]||answers[i].length<lessons[i].questions.length||answers[i].some(v=>v===undefined)){document.getElementById('result-'+i).textContent='Avval barcha 10 ta savolga javob bering!';document.getElementById('result-'+i).className='mt-5 text-2xl font-bold text-yellow-300';return}let n=0;lessons[i].questions.forEach((q,j)=>{let s=answers[i][j];if(s===q[2])n++;document.querySelectorAll(`#quiz-${i} [data-q="${j}"]`).forEach((b,k)=>{b.disabled=true;b.classList.remove('selected');if(k===q[2])b.classList.add('correct');else if(k===s)b.classList.add('wrong')})});let p=n*10,r=document.getElementById('result-'+i),retry=document.getElementById('retry-'+i);retry.classList.remove('hidden');if(p>=80){r.textContent=`Ajoyib! ${p}% — dars tugadi, keyingi dars ochildi!`;r.className='mt-5 text-2xl font-bold text-green-400';if(!progress.includes(i)){progress.push(i);localStorage.setItem(key,JSON.stringify(progress));update();setTimeout(render,900)}}else{r.textContent=`Natija: ${p}%. Keyingi dars ochilishi uchun kamida 80% kerak.`;r.className='mt-5 text-2xl font-bold text-red-400'}}function retry(i){answers[i]=[];document.querySelectorAll(`#quiz-${i} button`).forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong','selected')});document.getElementById('result-'+i).textContent='Qayta urinib, barcha savollarga javob bering.';document.getElementById('result-'+i).className='mt-5 text-2xl font-bold text-indigo-300';document.getElementById('retry-'+i).classList.add('hidden')}function update(){let p=Math.round(progress.length/lessons.length*100);document.getElementById('progressText').textContent=p+'%';document.getElementById('progressFill').style.width=p+'%'}render();update();
</script></body></html>
