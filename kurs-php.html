<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHP Backend | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#172554,#312e81);color:#e0e7ff;font-family:Segoe UI,sans-serif}.card{background:#ffffff14;backdrop-filter:blur(12px);border-radius:24px;padding:28px;margin:24px auto;max-width:1000px}.btn{padding:14px 22px;border:0;border-radius:16px;background:#818cf8;color:#111827;font-weight:bold;cursor:pointer}.correct{background:#22c55e!important;color:white}.wrong{background:#ef4444!important;color:white}.progress-fill{height:100%;background:#818cf8;width:0;transition:width .5s}</style></head><body class="p-6"><div class="max-w-6xl mx-auto"><div class="text-center mb-12"><a href="mavjud-kurslar.html" class="text-indigo-300">← Kurslar</a><h1 class="text-5xl md:text-6xl font-extrabold text-indigo-300 mt-6">PHP BACKEND</h1><p class="text-xl mb-6">Server tomon dasturlash va ma’lumotlar bazasi</p><div class="h-5 bg-black/40 rounded-full overflow-hidden max-w-2xl mx-auto"><div id="progressFill" class="progress-fill"></div></div><p class="text-2xl mt-3">Bajarilishi: <span id="progressText">0%</span></p></div><div id="lessons"></div></div><script>const lessons=[{title:'1-dars: PHP bilan tanishuv',video:'OK_JCtrrv-c',text:'PHP sintaksisi, o‘zgaruvchilar, echo va serverda kod bajarilishi.',questions:[['PHP qayerda ishlaydi?',['Serverda','Faqat brauzerda','Printerda'],0],['PHP fayl kengaytmasi?',['.php','.html','.css'],0],['echo nima qiladi?',['Ma’lumot chiqaradi','Fayl o‘chiradi','Serverni to‘xtatadi'],0]]},{title:'2-dars: Form va session',video:'6EukZBGEDwQ',text:'HTML formalaridan ma’lumot qabul qilish, GET/POST va session bilan ishlash.',questions:[['POST nimaga ishlatiladi?',['Ma’lumot yuborishga','Rang tanlashga','Video ko‘rishga'],0],['Session nima saqlaydi?',['Foydalanuvchi holatini','Faqat CSSni','Rasmni'],0],['Form action nimani bildiradi?',['Ma’lumot yuboriladigan manzilni','Parolni','Rangni'],0]]},{title:'3-dars: MySQL va CRUD',video:'7S_tz1z_5bA',text:'PHP orqali ma’lumotlar bazasiga ulanish va CRUD amallarini bajarish.',questions:[['CRUD dagi C nimani anglatadi?',['Create','Color','Copy'],0],['SQL nima uchun kerak?',['Ma’lumotlar bazasi bilan ishlash uchun','Video montaj uchun','Dizayn uchun'],0],['SELECT nima qiladi?',['Ma’lumot o‘qiydi','Ma’lumot o‘chiradi','Serverni yopadi'],0]]}];let key='php_progress',progress=JSON.parse(localStorage.getItem(key)||'[]'),answers={};const box=document.getElementById('lessons');lessons.forEach((l,i)=>{let open=i===0||progress.includes(i-1),d=document.createElement('div');d.className='card';d.innerHTML=`<h2 class="text-3xl font-bold mb-5 text-indigo-300">${open?'▶':'🔒'} ${l.title}</h2>${open?`<iframe src="https://www.youtube.com/embed/${l.video}" class="w-full h-72 rounded-2xl mb-6" allowfullscreen></iframe><p class="text-lg mb-8">${l.text}</p><div id="quiz-${i}" class="space-y-5">${l.questions.map((q,j)=>`<div class="bg-white/10 p-5 rounded-2xl"><p class="font-bold text-xl mb-4">${j+1}. ${q[0]}</p><div class="grid md:grid-cols-3 gap-3">${q[1].map((a,k)=>`<button class="btn" data-q="${j}" onclick="choose(${i},${j},${k})">${a}</button>`).join('')}</div></div>`).join('')}</div><button class="mt-8 bg-green-500 text-black font-bold px-8 py-4 rounded-xl" onclick="check(${i})">JAVOBNI TEKSHIRISH</button><p id="result-${i}" class="mt-5 text-2xl font-bold"></p>`:'<div class="text-center py-20 text-2xl opacity-60">Oldingi darsni tugating!</div>'}`;box.appendChild(d)});function choose(l,q,a){(answers[l]??=[])[q]=a;document.querySelectorAll(`#quiz-${l} [data-q="${q}"]`).forEach((b,i)=>b.classList.toggle('ring-4',i===a))}function check(i){let n=0;lessons[i].questions.forEach((q,j)=>{let s=answers[i]?.[j];if(s===q[2])n++;document.querySelectorAll(`#quiz-${i} [data-q="${j}"]`).forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');else if(k===s)b.classList.add('wrong')})});let p=Math.round(n/lessons[i].questions.length*100),r=document.getElementById('result-'+i);if(p>=80){r.textContent=`Ajoyib! ${p}% – Keyingi dars ochildi!`;r.className='mt-5 text-2xl font-bold text-green-400';if(!progress.includes(i)){progress.push(i);localStorage.setItem(key,JSON.stringify(progress));update();setTimeout(()=>location.reload(),1200)}}else{r.textContent=`Yana urining! ${p}% (80% kerak)`;r.className='mt-5 text-2xl font-bold text-red-400'}}function update(){let p=Math.round(progress.length/lessons.length*100);progressText.textContent=p+'%';progressFill.style.width=p+'%'}update();</script></body></html>
