<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHP Backend | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#111827,#312e81);color:#eef2ff;font-family:Segoe UI,sans-serif}.lesson{background:#ffffff12;border:1px solid #ffffff20;backdrop-filter:blur(12px);border-radius:24px;padding:28px;margin:20px 0}.btn{background:#fbbf24;color:#111827;padding:12px 22px;border-radius:12px;font-weight:700}</style></head><body class="p-6"><main class="max-w-5xl mx-auto"><a href="mavjud-kurslar.html" class="text-yellow-300">← Barcha kurslar</a><h1 class="text-5xl font-black text-center mt-8">PHP Backend dasturlash</h1><p class="text-center text-xl text-white/70 mt-3">Server tomon dasturlashni noldan o‘rganing</p><div class="h-4 bg-black/30 rounded-full mt-8"><div id="bar" class="h-full bg-indigo-400 rounded-full" style="width:0%"></div></div><p class="text-center mt-3">Progress: <span id="pct">0%</span></p><div id="lessons"></div></main><script>const data=[['PHP bilan tanishuv','PHP sintaksisi, echo va o‘zgaruvchilar.'],['Shartlar va sikllar','if, switch, for, while va amaliy masalalar.'],['Massivlar va funksiyalar','Array, foreach va qayta ishlatiladigan kod.'],['Formalar va validatsiya','POST, GET va xavfsiz forma tekshiruvi.'],['Session va login','Foydalanuvchi autentifikatsiyasi asoslari.'],['MySQL bilan ishlash','Jadval, SELECT, INSERT va CRUD amaliyoti.'],['Mini loyiha','PHP yordamida kichik web ilova yaratish.']];let done=JSON.parse(localStorage.getItem('php_progress')||'[]');function render(){lessons.innerHTML=data.map((x,i)=>`<section class="lesson"><h2 class="text-2xl font-bold">${done.includes(i)?'✅':'📘'} ${i+1}. ${x[0]}</h2><p class="text-white/70 mt-3">${x[1]}</p><button class="btn mt-5" onclick="complete(${i})" ${done.includes(i)?'disabled':''}>${done.includes(i)?'Tugallangan':'Darsni tugatdim'}</button></section>`).join('');let p=Math.round(done.length/data.length*100);bar.style.width=p+'%';pct.textContent=p+'%'}function complete(i){if(!done.includes(i)){done.push(i);localStorage.setItem('php_progress',JSON.stringify(done));render()}}render()</script></body></html>
