<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#111827,#4c1d95);font-family:Segoe UI,sans-serif}.card{background:#ffffff12;border:1px solid #ffffff20;backdrop-filter:blur(14px);border-radius:24px}.field{background:#ffffff12;border:1px solid #ffffff25;color:white;border-radius:12px;padding:12px;outline:0}</style></head><body class="text-white p-5"><main class="max-w-3xl mx-auto"><header class="text-center mb-6"><a href="index.html" class="text-yellow-300">← Bosh sahifa</a><h1 class="text-5xl font-black text-yellow-300 mt-4">PROFIL</h1></header><section class="card p-7"><div class="flex items-center gap-4 mb-7"><div id="avatar" class="w-20 h-20 rounded-full bg-gradient-to-tr from-yellow-400 to-pink-500 text-black flex items-center justify-center text-3xl font-black">U</div><div><h2 id="hello" class="text-2xl font-bold"></h2><p id="uid" class="text-white/50"></p></div></div><form id="profile" class="grid md:grid-cols-2 gap-4"><label>Ism<input id="name" class="field w-full mt-1" required></label><label>Telefon<input id="phone" class="field w-full mt-1" required></label><label class="md:col-span-2">Email<input id="email" class="field w-full mt-1" type="email" required></label><button class="md:col-span-2 bg-yellow-400 text-black font-bold py-3 rounded-xl">SAQLASH</button></form><button id="logout" class="w-full mt-4 bg-red-600 py-3 rounded-xl font-bold">CHIQISH</button><p id="msg" class="mt-4 text-green-300"></p></section></main><script>const user=JSON.parse(sessionStorage.getItem('currentUser')||localStorage.getItem('currentUser')||'null');if(!user)location.href='login.html';const $=id=>document.getElementById(id);$('name').value=user?.name||'';$('phone').value=user?.phone||'';$('email').value=user?.email||'';$('hello').textContent=user?.name||'Foydalanuvchi';$('uid').textContent=user?.id?'ID: '+user.id:'Admin';$('avatar').textContent=(user?.name||'U')[0].toUpperCase();$('profile').onsubmit=e=>{e.preventDefault();const updated={...user,name:$('name').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim().toLowerCase()};let all=JSON.parse(localStorage.getItem('talimhub_users')||'[]'),i=all.findIndex(x=>String(x.id)===String(user.id));if(i>=0)all[i]={...all[i],...updated};localStorage.setItem('talimhub_users',JSON.stringify(all));sessionStorage.setItem('currentUser',JSON.stringify(updated));$('hello').textContent=updated.name;$('msg').textContent='Profil muvaffaqiyatli yangilandi.'};$('logout').onclick=()=>{sessionStorage.removeItem('currentUser');localStorage.removeItem('currentUser');location.href='login.html'};</script></body></html>
