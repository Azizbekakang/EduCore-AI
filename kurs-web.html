<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web dasturlash | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#1e3a8a,#3b82f6);color:#e2e8f0;font-family:Segoe UI,sans-serif}.card{background:#ffffff14;backdrop-filter:blur(12px);border-radius:24px;padding:28px;margin:24px auto;max-width:1000px}.btn{padding:12px 20px;border:0;border-radius:14px;background:#f59e0b;color:#000;font-weight:bold;cursor:pointer}.locked{opacity:.5;position:relative}.locked:after{content:'QULF';position:absolute;inset:40% 0;text-align:center;font-size:4rem;color:#fbbf24;font-weight:900}</style></head><body class="p-6"><div class="max-w-6xl mx-auto"><div class="flex justify-between mb-8"><a href="mavjud-kurslar.html">← Kurslar</a><a href="sertifikat.html">Sertifikat</a></div><h1 class="text-5xl font-black text-center mb-4">WEB DASTURLASH 0 DAN PRO GACHA</h1><p class="text-center text-xl mb-8">HTML • CSS • JavaScript • React</p><div class="max-w-2xl mx-auto h-5 bg-black/30 rounded-full overflow-hidden"><div id="fill" class="h-full bg-gradient-to-r from-cyan-400 to-purple-500" style="width:0%"></div></div><p class="text-center text-2xl mt-3 mb-10">Bajarilishi: <span id="percent">0%</span></p><div id="lessons"></div></div><script>const lessons=[{title:'1-dars: HTML kirish',video:'UB1O30fR-EE',text:'HTML veb sahifaning tuzilishi va asosiy teglar.',q:[['HTML nima?',['Dizayn','Struktura','Logika'],1],['h1 nima?',['Katta sarlavha','Rasm','Link'],0],['p tegi?',['Paragraf','Rasm','Video'],0]]},{title:'2-dars: CSS asoslari',video:'OXGznpKZ_sA',text:'CSS yordamida sahifani bezash, rang va joylashuv.',q:[['CSS nima qiladi?',['Struktura','Dizayn','Server'],1],['Flexbox nima?',['Joylashuv tizimi','Video','Rasm'],0],['Grid nima?',['2D joylashuv','Audio','Matn'],0]]}];let progress=JSON.parse(localStorage.getItem('web_progress')||'[]');function draw(){lessonsEl.innerHTML='';lessons.forEach((l,i)=>{let unlocked=i===0||progress.includes(i-1),done=progress.includes(i),d=document.createElement('section');d.className='card '+(!unlocked?'locked':'');d.innerHTML=`<h2 class="text-3xl font-bold text-yellow-300 mb-5">${done?'✅':unlocked?'▶️':'🔒'} ${l.title}</h2>${unlocked?`<iframe src="https://www.youtube.com/embed/${l.video}" class="w-full h-72 rounded-xl mb-5" allowfullscreen></iframe><p class="text-lg mb-5">${l.text}</p><div class="space-y-4">${l.q.map((x,j)=>`<div class="bg-white/10 p-4 rounded-xl"><b>${j+1}. ${x[0]}</b><div class="grid sm:grid-cols-3 gap-2 mt-3">${x[1].map((a,k)=>`<button class="btn" onclick="answer(${i},${j},${k})">${a}</button>`).join('')}</div></div>`).join('')}</div><button id="check${i}" class="hidden mt-6 bg-emerald-400 px-6 py-3 rounded-xl text-black font-bold" onclick="check(${i})">Javobni tekshirish</button><p id="result${i}" class="mt-4 text-2xl font-bold"></p>`:'<div class="text-center py-24 text-3xl">Oldingi darsni tugating!</div>'}`;lessonsEl.appendChild(d)})}let lessonsEl=document.getElementById('lessons'),answers={};window.answer=(l,q,a)=>{answers[l]??=[];answers[l][q]=a;document.getElementById('check'+l).classList.remove('hidden')};window.check=i=>{let score=0;lessons[i].q.forEach((x,j)=>{if(answers[i]?.[j]===x[2])score++});let p=Math.round(score/lessons[i].q.length*100),r=document.getElementById('result'+i);if(p>=80){r.textContent='Ajoyib! Keyingi dars ochildi.';r.className='text-green-300';if(!progress.includes(i)){progress.push(i);localStorage.setItem('web_progress',JSON.stringify(progress));setTimeout(draw,800)}}else{r.textContent=`${p}% — kamida 80% kerak`;r.className='text-red-300'}};function update(){let p=Math.round(progress.length/lessons.length*100);fill.style.width=p+'%';percent.textContent=p+'%'}const oldDraw=draw;draw=()=>{oldDraw();update()};draw()</script></body></html>
