<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web dasturlash | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#082f49,#172554);color:#e0f2fe;font-family:Segoe UI,sans-serif}.card{background:#ffffff14;backdrop-filter:blur(12px);border:1px solid #ffffff1c;border-radius:24px;padding:28px;margin:24px auto;max-width:1000px;box-shadow:0 12px 35px #0005}.btn{padding:13px 18px;border:0;border-radius:14px;background:#38bdf8;color:#082f49;font-weight:700;cursor:pointer}.btn:disabled{cursor:not-allowed;opacity:.9}.selected{outline:3px solid white}.correct{background:#22c55e!important;color:#fff}.wrong{background:#ef4444!important;color:#fff}.bar{height:20px;background:#0f172a;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#38bdf8;transition:.4s}.video{width:100%;height:360px;border:0;border-radius:18px;margin:8px 0 22px}</style></head><body class="p-6"><main class="max-w-6xl mx-auto"><header class="text-center mb-12"><a href="mavjud-kurslar.html" class="text-sky-300">← Kurslar</a><h1 class="text-5xl md:text-6xl font-black text-sky-300 mt-6">WEB DASTURLASH</h1><p class="text-xl">HTML, CSS, JavaScript va responsive web ilovalar</p><div class="bar max-w-2xl mx-auto mt-6"><div id="fill" class="fill"></div></div><p class="text-2xl mt-3">Bajarilishi: <b id="percent">0%</b></p></header><div id="lessons"></div></main><script>
const lessons=[{title:'HTML asoslari',video:'qz0aGYrrlhU',pdf:'https://developer.mozilla.org/en-US/docs/Web/HTML',text:'HTML teglar, hujjat tuzilishi, havolalar, rasmlar va formalar.',q:[['HTML nimani bildiradi?','HyperText Markup Language'],['Sahifa sarlavhasi qaysi tegda?','h1'],['Havola qaysi tegda yoziladi?','a'],['Rasm tegining nomi?','img'],['Paragraf tegi?','p'],['Forma yaratish tegi?','form'],['HTML fayl kengaytmasi?','.html'],['Link manzili qaysi atributda?','href'],['Rasm manzili qaysi atributda?','src'],['Semantik tegga misol?','header']]},{title:'CSS va responsive dizayn',video:'OXGznpKZ_sA',pdf:'https://developer.mozilla.org/en-US/docs/Web/CSS',text:'Rang, shrift, box model, Flexbox, Grid va mobil ekranlar uchun dizayn.',q:[['CSS nimani boshqaradi?','Ko‘rinishni'],['Flexbox nimaga xizmat qiladi?','Elementlarni joylashtirishga'],['Grid nima?','Ikki o‘lchamli layout'],['Rang berish xossasi?','color'],['Orqa fon xossasi?','background'],['Ichki bo‘shliq?','padding'],['Tashqi bo‘shliq?','margin'],['Responsive nima?','Turli ekranlarga moslashish'],['Media query nima uchun?','Ekran shartlari uchun'],['Border nimani bildiradi?','Chegarani']]},{title:'JavaScript va interaktivlik',video:'PkZNo7MFNFg',pdf:'https://developer.mozilla.org/en-US/docs/Web/JavaScript',text:'O‘zgaruvchilar, funksiyalar, DOM, hodisalar va interaktiv web sahifalar.',q:[['JavaScript nima qo‘shadi?','Interaktivlikni'],['O‘zgaruvchi e’lon qilish?','let'],['Doimiy qiymat?','const'],['DOM nima?','Sahifa obyekt modeli'],['Click hodisasi?','click'],['Element topish usuli?','querySelector'],['Konsolga chiqarish?','console.log'],['Massiv nima?','Qiymatlar ro‘yxati'],['Funksiya nima?','Qayta ishlatiladigan kod'],['JSON nima?','Ma’lumot formati']]}];
const key='web_progress_v1',done=JSON.parse(localStorage.getItem(key)||'[]'),answers={},box=document.getElementById('lessons');
function render(){box.innerHTML='';lessons.forEach((l,i)=>{const open=i===0||done.includes(i-1),d=document.createElement('section');d.className='card '+(open?'':'opacity-50');d.innerHTML=`<h2 class="text-3xl font-bold text-sky-300 mb-4">${open?'▶':'🔒'} ${i+1}-dars: ${l.title}</h2>${open?`<iframe class="video" src="https://www.youtube.com/embed/${l.video}" title="${l.title} video darsi" allowfullscreen></iframe><p class="text-lg mb-6">${l.text}</p><a href="${l.pdf}" target="_blank" rel="noopener" class="inline-block bg-red-600 hover:bg-red-500 text-white font-bold px-7 py-4 rounded-xl mb-8">📘 PDF KITOBNI YUKLASH</a><div id="quiz${i}">${l.q.map((q,j)=>`<div class="bg-white/10 p-5 rounded-2xl mb-4"><p class="font-bold text-xl mb-3">${j+1}. ${q[0]}</p><div class="grid md:grid-cols-3 gap-3">${[q[1],['Internet','Rasm','Brauzer'][j%3],['Parol','Video','Printer'][(j+1)%3]].map((a,k)=>`<button class="btn" data-q="${j}" onclick="pick(${i},${j},${k})">${a}</button>`).join('')}</div></div>`).join('')}</div><div class="flex flex-wrap gap-2 mt-6"><button class="bg-green-500 text-black font-bold px-7 py-3 rounded-xl" onclick="check(${i})">JAVOBNI TEKSHIRISH</button><button id="retry${i}" class="hidden bg-yellow-400 text-black font-bold px-7 py-3 rounded-xl" onclick="retry(${i})">QAYTA URINISH</button></div><p id="result${i}" class="mt-5 text-xl font-bold"></p>`:'<div class="text-center py-20 text-2xl">Avvalgi darsni kamida 80% bilan tugating.</div>'}`;box.appendChild(d)})}function pick(l,q,a){(answers[l]??=[])[q]=a;document.querySelectorAll(`#quiz${l} [data-q="${q}"]`).forEach((b,k)=>b.classList.toggle('selected',k===a))}function check(i){const r=document.getElementById('result'+i),a=answers[i];if(!a||a.length!==10||a.some(x=>x===undefined)){r.textContent='Avval barcha 10 ta savolga javob bering!';r.className='mt-5 text-xl font-bold text-yellow-300';return}let score=0;lessons[i].q.forEach((q,j)=>{if(a[j]===0)score++;document.querySelectorAll(`#quiz${i} [data-q="${j}"]`).forEach((b,k)=>{b.disabled=true;b.classList.remove('selected');if(k===0)b.classList.add('correct');else if(k===a[j])b.classList.add('wrong')})});const p=Math.min(100,score*10);document.getElementById('retry'+i).classList.remove('hidden');if(p>=80){if(!done.includes(i))done.push(i);done.sort((a,b)=>a-b);localStorage.setItem(key,JSON.stringify(done));r.textContent=`Ajoyib! ${p}% — keyingi dars ochildi.`;r.className='mt-5 text-xl font-bold text-green-400';update();setTimeout(render,700)}else{r.textContent=`Natija: ${p}%. Keyingi dars uchun 80% kerak.`;r.className='mt-5 text-xl font-bold text-red-400'}}function retry(i){answers[i]=[];document.querySelectorAll(`#quiz${i} button`).forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong','selected')});document.getElementById('result'+i).textContent='0% dan qayta boshlandi.';document.getElementById('retry'+i).classList.add('hidden')}function update(){const p=Math.min(100,Math.round(done.length/lessons.length*100));document.getElementById('percent').textContent=p+'%';document.getElementById('fill').style.width=p+'%'}render();update();</script></body></html>
