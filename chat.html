<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#0f172a,#312e81);font-family:Segoe UI,sans-serif}.card{background:#ffffff12;border:1px solid #ffffff20;backdrop-filter:blur(14px);border-radius:22px}.msg{max-width:80%;padding:11px 14px;border-radius:16px;margin:8px 0}.field{background:#ffffff12;border:1px solid #ffffff25;color:white;border-radius:12px;padding:12px;outline:0}</style></head><body class="text-white p-5"><main class="max-w-5xl mx-auto"><header class="text-center mb-6"><a href="index.html" class="text-yellow-300">← Bosh sahifa</a><h1 class="text-4xl font-black text-yellow-300 mt-3">O‘QITUVCHI BILAN CHAT</h1><p class="text-white/60">Savolingizni yozing — suhbat brauzerda saqlanadi</p></header><section class="grid lg:grid-cols-3 gap-5"><aside class="card p-5"><h2 class="text-xl font-bold mb-4">Foydalanuvchilar</h2><input id="find" class="field w-full mb-3" placeholder="ID yoki ism"><div id="users" class="space-y-2"></div></aside><section class="card p-5 lg:col-span-2"><div id="who" class="border-b border-white/10 pb-3 mb-3 text-white/70">Avval foydalanuvchini tanlang</div><div id="messages" class="h-96 overflow-y-auto mb-3"></div><form id="form" class="hidden flex gap-2"><input id="text" class="field flex-1" placeholder="Xabar yozing..." autocomplete="off"><button class="bg-blue-500 px-5 rounded-xl font-bold">Yuborish</button></form></section></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const me=JSON.parse(sessionStorage.getItem('currentUser')||'{}'),users=JSON.parse(localStorage.getItem('talimhub_users')||'[]');let target=null;function key(){return'chat_'+(me.id||me.email||'guest')+'_'+(target?.id||'teacher')}function draw(){const data=JSON.parse(localStorage.getItem(key())||'[]');document.getElementById('messages').innerHTML=data.map(m=>`<div class="msg ${m.from==='me'?'ml-auto bg-blue-600':'bg-slate-700'}"><p>${esc(m.text)}</p><small class="text-white/50">${esc(m.time)}</small></div>`).join('');const box=document.getElementById('messages');box.scrollTop=box.scrollHeight}function choose(u){target=u;document.getElementById('who').innerHTML=`Chat: <b>${esc(u.name)}</b> <span class="text-white/50">#${esc(u.id)}</span>`;document.getElementById('form').classList.remove('hidden');draw()}function renderUsers(){const list=users.filter(u=>(u.name+' '+u.id).toLowerCase().includes(document.getElementById('find').value.toLowerCase()));document.getElementById('users').innerHTML=`<button class="w-full text-left bg-indigo-600 p-3 rounded-xl" onclick="choose({id:'teacher',name:'O‘qituvchi'})">👨‍🏫 O‘qituvchi</button>`+list.map(u=>`<button class="w-full text-left bg-white/10 p-3 rounded-xl hover:bg-white/20" onclick='choose(${JSON.stringify(u)})'>${esc(u.name)} <small class="text-white/50">#${esc(u.id)}</small></button>`).join('')}document.getElementById('find').oninput=renderUsers;document.getElementById('form').onsubmit=e=>{e.preventDefault();const t=document.getElementById('text').value.trim();if(!t||!target)return;const a=JSON.parse(localStorage.getItem(key())||'[]');a.push({from:'me',text:t,time:new Date().toLocaleString('uz-UZ')});localStorage.setItem(key(),JSON.stringify(a));document.getElementById('text').value='';draw();if(target.id==='teacher')setTimeout(()=>{const b=JSON.parse(localStorage.getItem(key())||'[]');b.push({from:'teacher',text:'Xabaringiz qabul qilindi. Tez orada javob beramiz.',time:new Date().toLocaleString('uz-UZ')});localStorage.setItem(key(),JSON.stringify(b));draw()},700)};renderUsers();</script></body></html>
