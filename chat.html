<!doctype html>
<html lang="uz">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#0f172a,#312e81);font-family:Segoe UI,sans-serif}.card{background:#ffffff12;border:1px solid #ffffff20;backdrop-filter:blur(14px);border-radius:22px}.msg{max-width:80%;padding:11px 14px;border-radius:16px;margin:8px 0}.field{background:#ffffff12;border:1px solid #ffffff25;color:white;border-radius:12px;padding:12px;outline:0}.field:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #60a5fa33}</style></head>
<body class="text-white p-5"><main class="max-w-5xl mx-auto"><header class="text-center mb-6"><a href="index.html" class="text-yellow-300">← Bosh sahifa</a><h1 class="text-4xl font-black text-yellow-300 mt-3">CHAT</h1><p class="text-white/60">Xabar yuborsangiz, u aynan tanlangan foydalanuvchining chatida ham ko‘rinadi.</p></header><section class="grid lg:grid-cols-3 gap-5"><aside class="card p-5"><h2 class="text-xl font-bold mb-4">Suhbatlar</h2><input id="find" class="field w-full mb-3" placeholder="ID yoki ism bo‘yicha izlash"><div id="users" class="space-y-2"></div></aside><section class="card p-5 lg:col-span-2"><div id="who" class="border-b border-white/10 pb-3 mb-3 text-white/70">Suhbatni tanlang</div><div id="messages" class="h-96 overflow-y-auto mb-3"></div><form id="form" class="hidden flex gap-2"><input id="text" class="field flex-1" placeholder="Xabar yozing..." autocomplete="off"><button class="bg-blue-500 px-5 rounded-xl font-bold">Yuborish</button></form><p id="notice" class="text-sm text-white/50 mt-3"></p></section></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const me=JSON.parse(sessionStorage.getItem('currentUser')||localStorage.getItem('currentUser')||'{}'),users=JSON.parse(localStorage.getItem('talimhub_users')||'[]');let target=null;function personId(x){return String(x?.id||x?.email||'teacher')}function threadKey(){const ids=[personId(me),personId(target)].sort();return'educore_chat_'+ids.join('_')}function read(){try{return JSON.parse(localStorage.getItem(threadKey())||'[]')}catch{return[]}}function draw(){if(!target)return;const data=read();document.getElementById('messages').innerHTML=data.map(m=>{const own=String(m.senderId)===personId(me);return`<div class="msg ${own?'ml-auto bg-blue-600':'bg-slate-700'}"><p>${esc(m.text)}</p><small class="text-white/50">${esc(m.time)} · ${own?'Siz':esc(m.senderName||target.name)}</small></div>`}).join('')||'<p class="text-white/40 text-center mt-20">Hali xabar yo‘q.</p>';const box=document.getElementById('messages');box.scrollTop=box.scrollHeight}function choose(u){target=u;document.getElementById('who').innerHTML=`Chat: <b>${esc(u.name)}</b> <span class="text-white/50">#${esc(u.id||'teacher')}</span>`;document.getElementById('form').classList.remove('hidden');document.getElementById('notice').textContent='Bu suhbatdagi xabarlar ikkala tomonda bir xil saqlanadi.';draw()}function renderUsers(){const term=document.getElementById('find').value.toLowerCase();const list=users.filter(u=>String(u.id).includes(term)||u.name.toLowerCase().includes(term));document.getElementById('users').innerHTML=`<button class="w-full text-left bg-indigo-600 p-3 rounded-xl" onclick="choose({id:'teacher',name:'O‘qituvchi'})">👨‍🏫 O‘qituvchi</button>`+list.map(u=>`<button class="w-full text-left bg-white/10 p-3 rounded-xl hover:bg-white/20" onclick='choose(${JSON.stringify({id:u.id,name:u.name,email:u.email})})'>${esc(u.name)}<small class="block text-white/50">ID: ${esc(u.id)}</small></button>`).join('')}document.getElementById('find').oninput=renderUsers;document.getElementById('form').onsubmit=e=>{e.preventDefault();const text=document.getElementById('text').value.trim();if(!text||!target)return;const data=read();data.push({senderId:personId(me),senderName:me.name||'Foydalanuvchi',receiverId:personId(target),receiverName:target.name,text,time:new Date().toLocaleString('uz-UZ')});localStorage.setItem(threadKey(),JSON.stringify(data));document.getElementById('text').value='';draw();if(personId(target)==='teacher')setTimeout(()=>{const reply=read();reply.push({senderId:'teacher',senderName:'O‘qituvchi',receiverId:personId(me),receiverName:me.name,text:'Xabaringiz qabul qilindi. Tez orada javob beramiz.',time:new Date().toLocaleString('uz-UZ')});localStorage.setItem(threadKey(),JSON.stringify(reply));draw()},700)};renderUsers();</script></body></html>
