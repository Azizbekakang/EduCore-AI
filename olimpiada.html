<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olimpiada | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#111827,#1e3a8a);font-family:Segoe UI,sans-serif}.box{max-width:900px;margin:24px auto;background:#ffffff12;backdrop-filter:blur(12px);border:1px solid #ffffff20;border-radius:24px;padding:28px}.answer{width:100%;padding:12px;border-radius:10px;background:#ffffff12;border:1px solid #ffffff30;color:white}</style></head><body class="text-white p-5"><main class="max-w-6xl mx-auto"><header class="text-center mb-8"><a href="index.html" class="text-yellow-300">← Bosh sahifa</a><h1 class="text-5xl font-black text-yellow-300 mt-4">OLIMPIADALAR</h1><p class="text-white/70">Admin paneldan nashr qilingan olimpiadalarni tanlang</p></header><div id="list"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const data=JSON.parse(localStorage.getItem('olimpiadas')||'[]').filter(o=>o.published);const list=document.getElementById('list');if(!data.length)list.innerHTML='<div class="box text-center text-xl">Hozircha nashr qilingan olimpiada yo‘q.</div>';else data.forEach((o,i)=>{const d=document.createElement('section');d.className='box';d.innerHTML=`<h2 class="text-3xl font-bold text-yellow-300">${esc(o.name)}</h2><p class="text-white/70 mt-2">${esc(o.start)} — ${esc(o.end)}</p><p class="my-4">${o.tasks?.length||0} ta savol</p><div>${(o.tasks||[]).map((q,j)=>`<label class="block mb-4"><span class="block mb-1">${j+1}. ${esc(q.text)}</span><input class="answer" data-i="${i}" data-q="${j}" placeholder="Javobingiz"></label>`).join('')}</div><button class="bg-green-500 text-black font-bold px-6 py-3 rounded-xl" onclick="finish(${i})">YAKUNLASH</button><p id="res${i}" class="mt-4 font-bold"></p>`;list.appendChild(d)});function finish(i){const o=data[i],inputs=[...document.querySelectorAll(`[data-i="${i}"]`)],score=inputs.reduce((n,x)=>n+(x.value.trim().toLowerCase()==String(o.tasks[Number(x.dataset.q)].answer).trim().toLowerCase()?1:0),0),p=o.tasks.length?Math.round(score/o.tasks.length*100):0;document.getElementById('res'+i).textContent=`Natija: ${score}/${o.tasks.length} (${p}%)`;const s=JSON.parse(localStorage.getItem('subs')||'[]');const u=JSON.parse(sessionStorage.getItem('currentUser')||'{}');s.push({olIdx:o.name,userId:u.id||'guest',userName:u.name||'Anonim',score,percent:p,when:new Date().toLocaleString('uz-UZ')});localStorage.setItem('subs',JSON.stringify(s))}</script></body></html>
