<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin panel | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><style>body{background:linear-gradient(135deg,#020617,#172554);font-family:Segoe UI,sans-serif}.panel{background:#ffffff0d;border:1px solid #ffffff1c;backdrop-filter:blur(16px);border-radius:20px}.field{background:#02061788;border:1px solid #ffffff25;color:white;border-radius:10px;padding:11px;width:100%;outline:0}.btn{padding:10px 14px;border-radius:10px;font-weight:700}.stat{background:#ffffff0d;border:1px solid #ffffff18;border-radius:16px;padding:18px}.stat b{display:block;font-size:2rem}</style></head><body class="text-white p-5"><div id="denied" class="min-h-screen flex items-center justify-center"><div class="panel p-8 text-center"><h1 class="text-3xl font-black text-red-400">Kirish taqiqlangan</h1><p class="my-4 text-white/60">Admin akkaunti bilan kirishingiz kerak.</p><a href="login.html" class="btn bg-yellow-400 text-black">Login sahifasi</a></div></div><main id="app" class="hidden max-w-7xl mx-auto"><header class="panel p-5 flex flex-wrap justify-between gap-4 items-center mb-6"><div><p class="text-xs uppercase tracking-widest text-yellow-300">EduCore AI</p><h1 class="text-3xl font-black">Professional Admin Dashboard</h1><p id="clock" class="text-white/50"></p></div><div class="flex gap-2"><button id="export" class="btn bg-indigo-600">Eksport</button><button id="logout" class="btn bg-red-600">Chiqish</button></div></header><section class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6"><div class="stat"><i class="fa-solid fa-trophy text-yellow-300"></i><b id="olCount">0</b><span>Olimpiada</span></div><div class="stat"><i class="fa-solid fa-circle-question text-cyan-300"></i><b id="qCount">0</b><span>Savol</span></div><div class="stat"><i class="fa-solid fa-code text-green-300"></i><b id="problemCount">0</b><span>Masala</span></div><div class="stat"><i class="fa-solid fa-users text-pink-300"></i><b id="userCount">0</b><span>Foydalanuvchi</span></div><div class="stat"><i class="fa-solid fa-paper-plane text-orange-300"></i><b id="subCount">0</b><span>Topshiriq</span></div></section><section class="grid lg:grid-cols-3 gap-6"><div class="panel p-5"><h2 class="text-xl font-bold mb-4">Olimpiada yaratish</h2><input id="olName" class="field mb-3" placeholder="Nomi"><input id="olStart" type="datetime-local" class="field mb-3"><input id="olEnd" type="datetime-local" class="field mb-3"><textarea id="olDesc" class="field mb-3" placeholder="Tavsif"></textarea><input id="olDuration" type="number" min="1" class="field mb-3" placeholder="Davomiyligi (daqiqa)"><button id="createOl" class="btn bg-emerald-500 text-black w-full">+ Olimpiada yaratish</button></div><div class="panel p-5 lg:col-span-2"><div class="flex flex-wrap gap-3 items-center justify-between"><h2 class="text-xl font-bold">Boshqaruv</h2><select id="olSelect" class="field max-w-sm text-black"><option value="">Olimpiadani tanlang</option></select></div><p id="olInfo" class="text-white/60 my-4"></p><div class="flex flex-wrap gap-2"><button id="publish" class="btn bg-blue-600">Nashr qilish</button><button id="hide" class="btn bg-slate-600">Yashirish</button><button id="deleteOl" class="btn bg-red-600">O‘chirish</button></div></div></section><section class="grid lg:grid-cols-2 gap-6 mt-6"><div class="panel p-5"><h2 class="text-xl font-bold mb-4">Olimpiada savoli</h2><input id="qText" class="field mb-3" placeholder="Savol matni"><input id="qAns" class="field mb-3" placeholder="To‘g‘ri javob"><input id="qPoints" type="number" min="1" value="10" class="field mb-3" placeholder="Ball"><button id="addQ" class="btn bg-emerald-500 text-black">Savol qo‘shish</button><div id="questions" class="mt-5 space-y-2 max-h-96 overflow-auto"></div></div><div class="panel p-5"><h2 class="text-xl font-bold mb-4">Masala qo‘shish</h2><input id="pName" class="field mb-3" placeholder="Masala nomi"><textarea id="pText" class="field mb-3" placeholder="To‘liq shart"></textarea><input id="pAns" class="field mb-3" placeholder="Javob (ixtiyoriy)"><div class="grid grid-cols-2 gap-2"><select id="pDiff" class="field text-black"><option>Oson</option><option>O‘rta</option><option>Qiyin</option></select><input id="pCat" class="field" placeholder="Kategoriya"></div><input id="pPoints" type="number" min="1" value="10" class="field my-3"><button id="addP" class="btn bg-cyan-400 text-black">Masala qo‘shish</button><div id="problems" class="mt-5 space-y-2 max-h-96 overflow-auto"></div></div></section><section class="panel p-5 mt-6"><h2 class="text-xl font-bold mb-4">Topshiriqlar</h2><div id="subs" class="space-y-2 max-h-80 overflow-auto"></div></section></main><script>const admin=JSON.parse(sessionStorage.getItem('currentUser')||'null');if(admin?.role==='admin'){denied.classList.add('hidden');app.classList.remove('hidden')}const $=id=>document.getElementById(id),get=(k,d=[])=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d)),put=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function idx(){return $('olSelect').value===''?null:Number($('olSelect').value)}function refresh(){const o=get('olimpiadas'),i=idx(),x=i===null?null:o[i];$('olSelect').innerHTML='<option value="">Olimpiadani tanlang</option>'+o.map((v,n)=>`<option value="${n}">${esc(v.name)} ${v.published?'• nashr':''}</option>`).join('');if(i!==null&&o[i])$('olSelect').value=i;$('olInfo').innerHTML=x?`${esc(x.name)} · ${x.tasks?.length||0} savol · ${x.published?'Nashr qilingan':'Yashirin'}<br>${esc(x.start||'')} — ${esc(x.end||'')}<br>${esc(x.description||'')}`:'Olimpiada tanlanmagan';$('questions').innerHTML=x?.tasks?.length?x.tasks.map((q,n)=>`<div class="bg-white/10 rounded-lg p-3"><b>${n+1}. ${esc(q.text)}</b><small class="block text-white/50">Javob: ${esc(q.answer)} · ${q.points||10} ball</small><button class="btn bg-red-600 text-xs mt-2" onclick="delQ(${i},${n})">O‘chirish</button></div>`).join(''):'<p class="text-white/50">Savollar yo‘q.</p>';$('problems').innerHTML=get('masalalar').map((p,n)=>`<div class="bg-white/10 rounded-lg p-3 flex justify-between"><span><b>${esc(p.name)}</b><small class="block text-white/50">${esc(p.category||'Umumiy')} · ${esc(p.difficulty||'O‘rta')}</small></span><button class="btn bg-red-600 text-xs" onclick="delP(${n})">O‘chirish</button></div>`).join('')||'<p class="text-white/50">Masalalar yo‘q.</p>';$('subs').innerHTML=get('subs').map(s=>`<div class="bg-white/10 rounded-lg p-3"><b>${esc(s.userName||'Anonim')}</b> · ${esc(s.olIdx)} · ${s.score||0} ball · ${esc(s.when||'')}</div>`).join('')||'<p class="text-white/50">Topshiriqlar yo‘q.</p>';$('olCount').textContent=o.length;$('qCount').textContent=o.reduce((n,v)=>n+(v.tasks?.length||0),0);$('problemCount').textContent=get('masalalar').length;$('userCount').textContent=get('talimhub_users').length;$('subCount').textContent=get('subs').length}$('createOl').onclick=()=>{const name=$('olName').value.trim(),start=$('olStart').value,end=$('olEnd').value;if(!name||!start||!end)return alert('Nomi, boshlanishi va tugashini kiriting.');const o=get('olimpiadas');o.push({id:Date.now(),name,start,end,description:$('olDesc').value.trim(),duration:$('olDuration').value,tasks:[],users:[],published:false,createdAt:new Date().toISOString()});put('olimpiadas',o);refresh()};$('olSelect').onchange=refresh;function setPub(v){const i=idx();if(i===null)return alert('Olimpiadani tanlang.');const o=get('olimpiadas');o[i].published=v;put('olimpiadas',o);refresh()}$('publish').onclick=()=>setPub(true);$('hide').onclick=()=>setPub(false);$('deleteOl').onclick=()=>{const i=idx();if(i===null)return;if(confirm('O‘chirilsinmi?')){const o=get('olimpiadas');o.splice(i,1);put('olimpiadas',o);refresh()}};$('addQ').onclick=()=>{const i=idx(),text=$('qText').value.trim(),answer=$('qAns').value.trim();if(i===null)return alert('Olimpiadani tanlang.');if(!text||!answer)return alert('Savol va javobni kiriting.');const o=get('olimpiadas');o[i].tasks??=[];o[i].tasks.push({name:String.fromCharCode(65+o[i].tasks.length),text,answer,points:Number($('qPoints').value)||10});put('olimpiadas',o);$('qText').value=$('qAns').value='';refresh()};window.delQ=(i,n)=>{const o=get('olimpiadas');o[i].tasks.splice(n,1);put('olimpiadas',o);refresh()};$('addP').onclick=()=>{const name=$('pName').value.trim(),text=$('pText').value.trim();if(!name||!text)return alert('Masala nomi va shartini kiriting.');const a=get('masalalar');a.push({id:Date.now(),name,text,answer:$('pAns').value.trim(),difficulty:$('pDiff').value,category:$('pCat').value.trim()||'Umumiy',points:Number($('pPoints').value)||10,createdAt:new Date().toISOString()});put('masalalar',a);['pName','pText','pAns','pCat'].forEach(x=>$(x).value='');refresh()};window.delP=n=>{const a=get('masalalar');a.splice(n,1);put('masalalar',a);refresh()};$('export').onclick=()=>{const data={olimpiadas:get('olimpiadas'),masalalar:get('masalalar'),users:get('talimhub_users'),subs:get('subs'),ranking:get('ranking')};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='educore-backup.json';a.click()};$('logout').onclick=()=>{sessionStorage.removeItem('currentUser');location.href='login.html'};setInterval(()=>$('clock').textContent=new Date().toLocaleString('uz-UZ'),1000);refresh();</script></body></html>
