<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reyting | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#020617,#1e1b4b,#312e81);font-family:Segoe UI,sans-serif}.card{background:#ffffff12;border:1px solid #ffffff1c;backdrop-filter:blur(14px);border-radius:22px}.row:hover{background:#ffffff12;transform:translateY(-2px)}.field{background:#ffffff12;border:1px solid #ffffff25;color:white;border-radius:12px;padding:12px;outline:0}</style></head><body class="text-white p-6"><main class="max-w-6xl mx-auto"><header class="text-center mb-8"><a href="index.html" class="text-yellow-300">← Bosh sahifa</a><h1 class="text-5xl font-black text-yellow-300 mt-4">REYTING</h1><p class="text-white/60">Olimpiada va topshiriqlar natijalari asosida avtomatik reyting</p></header><section class="card p-5 mb-6 flex flex-wrap gap-3"><input id="search" class="field flex-1 min-w-64" placeholder="Ism bo‘yicha izlash"><select id="sort" class="field text-black"><option value="score">Ball bo‘yicha</option><option value="name">Ism bo‘yicha</option><option value="new">Yangilar</option></select><button id="clear" class="bg-red-600 px-4 py-3 rounded-xl font-bold">Tozalash</button></section><section class="card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-left"><thead class="bg-white/10"><tr><th class="p-4">#</th><th class="p-4">Foydalanuvchi</th><th class="p-4">Ball</th><th class="p-4">Foiz</th><th class="p-4">Faollik</th></tr></thead><tbody id="body"></tbody></table></div><p id="empty" class="hidden p-10 text-center text-white/60">Hozircha reyting mavjud emas.</p></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function records(){const subs=JSON.parse(localStorage.getItem('subs')||'[]'),map={};subs.forEach(s=>{const id=s.userId||s.userName||'guest';if(!map[id])map[id]={name:s.userName||'Anonim',score:0,percent:0,count:0,when:s.when};map[id].score+=Number(s.score||0);map[id].percent=Math.round(map[id].percent*(map[id].count||0)/(map[id].count+1)+(Number(s.percent||0)/(map[id].count+1)));map[id].count++ ;map[id].when=s.when||map[id].when});return Object.values(map)}function render(){let a=records(),term=document.getElementById('search').value.toLowerCase(),sort=document.getElementById('sort').value;a=a.filter(x=>x.name.toLowerCase().includes(term));if(sort==='name')a.sort((x,y)=>x.name.localeCompare(y.name));else if(sort==='new')a.sort((x,y)=>String(y.when).localeCompare(String(x.when)));else a.sort((x,y)=>y.score-x.score);document.getElementById('body').innerHTML=a.map((x,i)=>`<tr class="row border-b border-white/10"><td class="p-4 font-black text-yellow-300">${i+1}</td><td class="p-4 font-bold">${esc(x.name)}</td><td class="p-4 text-cyan-300">${x.score}</td><td class="p-4">${x.percent}%</td><td class="p-4 text-white/60">${esc(x.when||'—')}</td></tr>`).join('');document.getElementById('empty').classList.toggle('hidden',a.length>0)}document.getElementById('search').oninput=render;document.getElementById('sort').onchange=render;document.getElementById('clear').onclick=()=>{if(confirm('Reytingni tozalaysizmi?')){localStorage.removeItem('ranking');localStorage.removeItem('subs');render()}};render();</script></body></html>
