<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Prompt Engineering | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#0f172a,#164e63);color:#ecfeff;font-family:Segoe UI,sans-serif}.lesson{background:#ffffff12;border:1px solid #67e8f933;border-radius:24px;padding:28px;margin:20px 0}.btn{background:#22d3ee;color:#083344;padding:12px 22px;border-radius:12px;font-weight:700}</style></head><body class="p-6"><main class="max-w-5xl mx-auto"><a href="mavjud-kurslar.html" class="text-cyan-300">← Barcha kurslar</a><h1 class="text-5xl font-black text-center mt-8">AI Prompt Engineering</h1><p class="text-center text-xl text-cyan-100/70 mt-3">AI’dan aniq, foydali va professional natija oling</p><div id="lessons" class="mt-10"></div></main><script>const topics=['Prompt asoslari va rol berish','Aniq vazifa va kontekst yozish','Few-shot va chain-of-thought','Matn, kod va rasm uchun promptlar','AI bilan tadqiqot va tekshirish','Ish jarayonini avtomatlashtirish','Portfolio: real AI workflow'];let done=JSON.parse(localStorage.getItem('prompt_progress')||'[]');function draw(){lessons.innerHTML=topics.map((t,i)=>`<article class="lesson"><h2 class="text-2xl font-bold">${done.includes(i)?'✅':'✨'} ${i+1}. ${t}</h2><p class="text-cyan-100/70 mt-3">Nazariya, misollar va amaliy topshiriq orqali o‘rganing.</p><button class="btn mt-5" onclick="finish(${i})" ${done.includes(i)?'disabled':''}>${done.includes(i)?'Bajarildi':'Topshiriqni yakunlash'}</button></article>`).join('')}function finish(i){if(!done.includes(i)){done.push(i);localStorage.setItem('prompt_progress',JSON.stringify(done));draw()}}draw()</script></body></html>
