<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Prompt Engineering | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#1e1b4b,#581c87);color:#f5f3ff;font-family:Segoe UI,sans-serif}.card{background:#ffffff14;backdrop-filter:blur(12px);border-radius:24px;padding:28px;margin:24px auto;max-width:1000px}.btn{padding:13px 18px;border:0;border-radius:14px;background:#c084fc;color:#1e1033;font-weight:700;cursor:pointer}.btn:disabled{cursor:not-allowed;opacity:.9}.selected{outline:3px solid #fff}.correct{background:#22c55e!important;color:#fff}.wrong{background:#ef4444!important;color:#fff}.progress-fill{height:100%;background:#e879f9;width:0;transition:width .5s}</style></head>
<body class="p-6"><main class="max-w-6xl mx-auto"><header class="text-center mb-12"><a href="mavjud-kurslar.html" class="text-fuchsia-300">← Kurslar</a><h1 class="text-5xl md:text-6xl font-extrabold text-fuchsia-300 mt-6">PROMPT ENGINEERING</h1><p class="text-xl mb-6">AI bilan aniq va samarali muloqot qiling</p><div class="h-5 bg-black/40 rounded-full overflow-hidden max-w-2xl mx-auto"><div id="progressFill" class="progress-fill"></div></div><p class="text-2xl mt-3">Bajarilishi: <span id="progressText">0%</span></p></header><div id="lessons"></div></main>
<script>
const lessons=[
{title:'1-dars: Yaxshi prompt tuzilishi',video:'jC4v5AS4RIM',text:'Rol, vazifa, kontekst va natija formatidan foydalangan holda kuchli prompt yozing.',questions:[['Prompt nima?',['AI ga beriladigan ko‘rsatma','Parol','Rasm formati'],0],['Rol berish nima uchun kerak?',['AI vazifasini aniqlash uchun','Internetni yoqish uchun','Fayl saqlash uchun'],0],['Kontekst nimani beradi?',['Vazifa haqida qo‘shimcha ma’lumotni','Faqat rangni','Parolni'],0],['Aniq topshiriq qanday bo‘ladi?',['Maqsadi ko‘rsatilgan','Faqat bitta so‘zli','Tasodifiy'],0],['Promptda auditoriyani ko‘rsatish nima beradi?',['Javob uslubini moslaydi','Internetni tezlatadi','Fayl yaratadi'],0],['Output nima?',['AI dan kutilgan natija','Kirish paroli','Brauzer'],0],['Cheklov nima?',['Javob chegarasi yoki sharti','Rasm','Video'],0],['Misol berish nima uchun kerak?',['Kutilgan javobni ko‘rsatish uchun','Kompyuterni o‘chirish uchun','Parolni yashirish uchun'],0],['Prompt tili qanday bo‘lishi kerak?',['Tushunarli va aniq','Har doim juda uzun','Tasodifiy'],0],['Yaxshi prompt natijasi qanday?',['Aniqroq javob','Har doim xato','Bo‘sh javob'],0]]},
{title:'2-dars: Few-shot va formatlar',video:'hJP5GqnTrNo',text:'AI javobining shaklini boshqarish, misollar berish va few-shot usulidan foydalanishni o‘rganing.',questions:[['Few-shot nima?',['Bir nechta misol berish','Internetni o‘chirish','Fayl yuklash'],0],['Zero-shot nima?',['Misolsiz topshiriq','Nol natija','Parol turi'],0],['Formatni ko‘rsatish nimaga yordam beradi?',['Javob tuzilishini boshqaradi','AI ni o‘chiradi','Internetni tezlatadi'],0],['JSON so‘rash nimani belgilaydi?',['Javob formatini','Rangni','Videoni'],0],['Chain of thought o‘rniga nima so‘rash xavfsizroq?',['Qisqa izoh va yakuniy javob','Maxfiy fikrlarni','Parolni'],0],['Promptga misol qanday ta’sir qiladi?',['Kutilgan uslubni ko‘rsatadi','Modelni o‘chiradi','Faylni yashiradi'],0],['Markdown nima?',['Matnni formatlash usuli','Dasturlash tili','Brauzer'],0],['Bullet list nima?',['Belgili ro‘yxat','Parol','Video'],0],['AI ga uzun matn berishda nima muhim?',['Asosiy kontekstni ajratish','Hammasini chalkashtirish','Savolsiz yuborish'],0],['Few-shot qachon foydali?',['Maxsus uslub yoki format kerak bo‘lganda','Hech qachon','Faqat o‘yinlarda'],0]]},
{title:'3-dars: Promptni tekshirish va yaxshilash',video:'jC4v5AS4RIM',text:'Javobni baholang, kamchiliklarni toping va promptni iteratsiya orqali yaxshilang.',questions:[['Iteratsiya nima?',['Promptni bosqichma-bosqich yaxshilash','Promptni o‘chirish','Rasm yuklash'],0],['AI javobi noto‘g‘ri bo‘lsa nima qilinadi?',['Kontekst va talab aniqlashtiriladi','Kompyuter o‘chiriladi','Hech narsa qilinmaydi'],0],['Hallucination nimani bildiradi?',['AI ning uydirma ma’lumot berishi','Tez javob','To‘g‘ri hisob'],0],['Faktlarni qanday tekshirish kerak?',['Ishonchli manba bilan','Tasodifiy taxmin bilan','Tekshirmasdan'],0],['Promptni test qilish nima?',['Turli savollarda tekshirish','Faylni o‘chirish','Rang almashtirish'],0],['Temperature yuqori bo‘lsa nima ortishi mumkin?',['Ijodkorlik va tasodifiylik','Aniqlik doim 100%','Internet tezligi'],0],['Feedback nima?',['Javobga berilgan baho yoki izoh','Parol','Video'],0],['Prompt versiyasini saqlash nima beradi?',['Yaxshi variantni solishtirish imkonini','AI ni bloklaydi','Rasmni o‘chiradi'],0],['Noaniq so‘zlar bo‘lsa nima qilish kerak?',['Aniq talab bilan almashtirish','Ko‘paytirish','O‘chirmaslik'],0],['Yaxshi natija uchun nima qilinadi?',['Prompt sinovdan o‘tkaziladi','Savol berilmaydi','Kontekst olib tashlanadi'],0]]}];
const key='prompt_progress',progress=JSON.parse(localStorage.getItem(key)||'[]'),answers={};
const box=document.getElementById('lessons');
function render(){box.innerHTML='';lessons.forEach((l,i)=>{const open=i===0||progress.includes(i-1),d=document.createElement('section');d.className='card';d.innerHTML=`<h2 class="text-3xl font-bold mb-5 text-fuchsia-300">${open?'▶':'🔒'} ${l.title}</h2>${open?`<iframe src="https://www.youtube.com/embed/${l.video}" class="w-full h-72 rounded-2xl mb-6" allowfullscreen></iframe><p class="text-lg mb-8">${l.text}</p><div id="quiz-${i}" class="space-y-5">${l.questions.map((q,j)=>`<div class="bg-white/10 p-5 rounded-2xl"><p class="font-bold text-xl mb-4">${j+1}. ${q[0]}</p><div class="grid md:grid-cols-3 gap-3">${q[1].map((a,k)=>`<button class="btn" data-q="${j}" onclick="choose(${i},${j},${k})">${a}</button>`).join('')}</div></div>`).join('')}</div><div class="flex flex-wrap gap-3 mt-8"><button class="bg-green-500 text-black font-bold px-8 py-4 rounded-xl" onclick="check(${i})">JAVOBNI TEKSHIRISH</button><button id="retry-${i}" class="hidden bg-yellow-400 text-black font-bold px-8 py-4 rounded-xl" onclick="retry(${i})">QAYTA URINISH</button></div><p id="result-${i}" class="mt-5 text-2xl font-bold"></p>`:'<div class="text-center py-20 text-2xl opacity-60">Bu dars oldingi dars tugagandan keyin ochiladi.</div>'}`;box.appendChild(d)})}function choose(l,q,a){(answers[l]??=[])[q]=a;document.querySelectorAll(`#quiz-${l} [data-q="${q}"]`).forEach((b,i)=>b.classList.toggle('selected',i===a))}function check(i){if(!answers[i]||answers[i].length<lessons[i].questions.length||answers[i].some(v=>v===undefined)){document.getElementById('result-'+i).textContent='Avval barcha 10 ta savolga javob bering!';document.getElementById('result-'+i).className='mt-5 text-2xl font-bold text-yellow-300';return}let n=0;lessons[i].questions.forEach((q,j)=>{let s=answers[i][j];if(s===q[2])n++;document.querySelectorAll(`#quiz-${i} [data-q="${j}"]`).forEach((b,k)=>{b.disabled=true;b.classList.remove('selected');if(k===q[2])b.classList.add('correct');else if(k===s)b.classList.add('wrong')})});let p=n*10,r=document.getElementById('result-'+i),retry=document.getElementById('retry-'+i);retry.classList.remove('hidden');if(p>=80){r.textContent=`Ajoyib! ${p}% — dars tugadi, keyingi dars ochildi!`;r.className='mt-5 text-2xl font-bold text-green-400';if(!progress.includes(i)){progress.push(i);localStorage.setItem(key,JSON.stringify(progress));update();setTimeout(render,900)}}else{r.textContent=`Natija: ${p}%. Keyingi dars ochilishi uchun kamida 80% kerak.`;r.className='mt-5 text-2xl font-bold text-red-400'}}function retry(i){answers[i]=[];document.querySelectorAll(`#quiz-${i} button`).forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong','selected')});document.getElementById('result-'+i).textContent='Qayta urinib, barcha savollarga javob bering.';document.getElementById('result-'+i).className='mt-5 text-2xl font-bold text-fuchsia-300';document.getElementById('retry-'+i).classList.add('hidden')}function update(){let p=Math.round(progress.length/lessons.length*100);document.getElementById('progressText').textContent=p+'%';document.getElementById('progressFill').style.width=p+'%'}render();update();
</script></body></html>
