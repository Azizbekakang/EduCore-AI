<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mavjud kurslar | Edu-AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <style>
    body {
      background: radial-gradient(circle at top, rgba(59,130,246,.25), transparent 30%),
                  linear-gradient(135deg, #0f172a, #111827 35%, #1e1b4b);
      font-family: 'Segoe UI', sans-serif;
    }
    .glass { background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="min-h-screen text-white p-6 md:p-10">
  <main class="max-w-7xl mx-auto">
    <header class="flex justify-between items-center mb-12">
      <a href="index.html" class="text-yellow-300 font-semibold hover:text-yellow-200">
        <i class="fa-solid fa-arrow-left mr-2"></i>Bosh sahifa
      </a>
      <a href="sertifikat.html" class="glass px-4 py-2 rounded-xl text-sm font-medium">
        <i class="fa-solid fa-certificate mr-2 text-yellow-300"></i>Sertifikatlar
      </a>
    </header>

    <section class="text-center mb-12">
      <div class="inline-flex items-center gap-2 text-yellow-300 uppercase tracking-[0.3em] text-xs font-bold mb-4">
        <i class="fa-solid fa-graduation-cap"></i> Edu-AI Academy
      </div>
      <h1 class="text-5xl md:text-7xl font-black tracking-tight">Mavjud kurslar</h1>
      <p class="text-white/70 text-lg mt-4 max-w-2xl mx-auto">
        Kasbingiz uchun kerakli bilimni bosqichma-bosqich egallang.
      </p>
    </section>

    <div id="courses" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script>
    const courses = [
      {
        title: 'Python dasturlash',
        icon: 'fa-brands fa-python',
        desc: 'Python asoslari, algoritmlar, amaliy loyiha va dasturlash fikri.',
        link: 'kurs-python.html',
        color: 'yellow'
      },
      {
        title: 'Web dasturlash',
        icon: 'fa-solid fa-code',
        desc: 'HTML, CSS, JavaScript va responsive web ilovalarni yaratish.',
        link: 'kurs-web.html',
        color: 'blue'
      },
      {
        title: 'Ingliz tili A1–C1',
        icon: 'fa-solid fa-language',
        desc: 'Kundalik muloqotdan professional darajagacha o‘rganish.',
        link: 'kurs-ingliz.html',
        color: 'pink'
      },
      {
        title: 'PHP Backend',
        icon: 'fa-brands fa-php',
        desc: 'PHP, formalar, session, ma’lumotlar bazasi va serverli tushunchalar.',
        link: 'kurs-php.html',
        color: 'indigo'
      },
      {
        title: 'AI Prompt Engineering',
        icon: 'fa-solid fa-wand-magic-sparkles',
        desc: 'AI bilan to‘g‘ri muloqot, promptlar va samarali ishlov berish.',
        link: 'kurs-ai-prompt.html',
        color: 'violet'
      },
      {
        title: 'AI asoslari',
        icon: 'fa-solid fa-robot',
        desc: 'Sun’iy intellekt, ML, neural network va amaliy AI tushunchalari.',
        link: 'kurs-ai.html',
        color: 'cyan'
      }
    ];

    const palette = {
      yellow: { wrap: 'border-yellow-400/30 bg-yellow-400/10', icon: 'bg-yellow-500/15 text-yellow-300', text: 'text-yellow-300' },
      blue: { wrap: 'border-blue-400/30 bg-blue-400/10', icon: 'bg-blue-500/15 text-blue-300', text: 'text-blue-300' },
      pink: { wrap: 'border-pink-400/30 bg-pink-400/10', icon: 'bg-pink-500/15 text-pink-300', text: 'text-pink-300' },
      indigo: { wrap: 'border-indigo-400/30 bg-indigo-400/10', icon: 'bg-indigo-500/15 text-indigo-300', text: 'text-indigo-300' },
      violet: { wrap: 'border-violet-400/30 bg-violet-400/10', icon: 'bg-violet-500/15 text-violet-300', text: 'text-violet-300' },
      cyan: { wrap: 'border-cyan-400/30 bg-cyan-400/10', icon: 'bg-cyan-500/15 text-cyan-300', text: 'text-cyan-300' }
    };

    const container = document.getElementById('courses');
    container.innerHTML = courses.map(course => {
      const p = palette[course.color];
      return `
        <a href="${course.link}" class="glass ${p.wrap} rounded-3xl p-7 hover:-translate-y-1 transition duration-200 shadow-xl block">
          <div class="${p.icon} w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mb-6">
            <i class="${course.icon}"></i>
          </div>
          <h2 class="text-2xl font-bold mb-3">${course.title}</h2>
          <p class="text-white/70 min-h-[72px]">${course.desc}</p>
          <div class="mt-6 ${p.text} font-bold inline-flex items-center gap-2">
            Kursni boshlash <i class="fa-solid fa-arrow-right"></i>
          </div>
        </a>
      `;
    }).join('');
  </script>
</body>
</html>
