<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mavjud kurslar | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><style>body{background:radial-gradient(circle at 15% 0,#4338ca,transparent 35%),linear-gradient(135deg,#0f172a,#1e1b4b);font-family:Segoe UI,sans-serif}.card{background:#ffffff12;border:1px solid #ffffff24;backdrop-filter:blur(16px)}</style></head><body class="min-h-screen text-white p-6 md:p-10"><main class="max-w-7xl mx-auto"><header class="flex justify-between items-center mb-12"><a href="index.html" class="text-yellow-300"><i class="fa-solid fa-arrow-left mr-2"></i>Bosh sahifa</a><a href="sertifikat.html" class="bg-white/10 px-4 py-2 rounded-xl"><i class="fa-solid fa-certificate mr-2"></i>Sertifikatlar</a></header><section class="text-center mb-12"><span class="text-yellow-300 uppercase tracking-widest">EduCore Academy</span><h1 class="text-5xl md:text-7xl font-black mt-3">Mavjud kurslar</h1><p class="text-white/70 text-lg mt-4">Kasbingiz uchun kerakli bilimni bosqichma-bosqich egallang.</p></section><div id="courses" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div></main><script>const courses=[['Python dasturlash','fa-brands fa-python','Python asoslari, algoritmlar va amaliy loyihalar.','kurs-python.html','yellow'],['Web dasturlash','fa-solid fa-code','HTML, CSS, JavaScript va responsive web.','kurs-web.html','blue'],['Ingliz tili A1–C1','fa-solid fa-language','Kundalik muloqotdan professional darajagacha.','kurs-ingliz.html','pink'],['PHP Backend','fa-brands fa-php','PHP, formalar, session va ma’lumotlar bazasi.','kurs-php.html','indigo'],['AI Prompt Engineering','fa-solid fa-wand-magic-sparkles','AI bilan to‘g‘ri muloqot va kuchli promptlar.','kurs-ai-prompt.html','violet'],['AI asoslari','fa-solid fa-robot','Sun’iy intellekt, ML va amaliy AI vositalari.','kurs-ai.html','cyan']];courses.forEach(c=>coursesEl.innerHTML+=`<a href="${c[3]}" class="card rounded-3xl p-7 hover:-translate-y-2 transition"><div class="w-16 h-16 rounded-2xl bg-${c[4]}-400/20 text-${c[4]}-300 flex items-center justify-center text-3xl"><i class="${c[1]}"></i></div><h2 class="text-2xl font-bold mt-6">${c[0]}</h2><p class="text-white/65 mt-3 min-h-14">${c[2]}</p><div class="mt-6 text-yellow-300 font-bold">Kursni boshlash <i class="fa-solid fa-arrow-right ml-2"></i></div></a>`)</script></body></html>
