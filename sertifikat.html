<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sertifikatlar | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><style>body{background:radial-gradient(circle at top,#7c3aed,transparent 35%),linear-gradient(135deg,#0f172a,#312e81);font-family:Segoe UI,sans-serif}.certificate{background:linear-gradient(135deg,#fffdf2,#fff,#fef3c7);border:10px solid #d4af37;box-shadow:0 25px 80px #0008}.locked{filter:grayscale(.7);opacity:.78}</style></head>
<body class="min-h-screen text-white p-6 md:p-10"><main class="max-w-6xl mx-auto"><header class="flex justify-between mb-10"><a href="index.html" class="text-yellow-300"><i class="fa-solid fa-arrow-left mr-2"></i>Bosh sahifa</a><a href="mavjud-kurslar.html" class="bg-white/10 px-4 py-2 rounded-xl">Kurslar</a></header><section class="text-center mb-10"><i class="fa-solid fa-award text-6xl text-yellow-300"></i><h1 class="text-5xl font-black mt-4">Sertifikatlar markazi</h1><p class="text-white/70 mt-3">Kurs progressi va sertifikat holatini ko‘ring</p></section><div id="progressList" class="grid md:grid-cols-3 gap-5 mb-10"></div><section id="certificate" class="certificate locked text-slate-900 rounded-3xl p-8 md:p-16 text-center"><i class="fa-solid fa-lock text-4xl text-slate-500"></i><p class="uppercase tracking-[.3em] text-amber-700 font-bold mt-4">EduCore Academy</p><h2 class="text-5xl font-black text-indigo-900 my-5">SERTIFIKAT</h2><p class="text-lg">Ushbu sertifikat</p><p id="student" class="text-4xl font-bold text-purple-800 my-4">Talaba</p><p id="status" class="text-xl">kursni yakunlash uchun progressni to‘ldiring</p><button id="print" disabled class="mt-8 bg-slate-400 text-white px-8 py-4 rounded-xl font-bold">Sertifikatni chop etish</button></section></main><script>
const courses=[['python_progress','Python dasturlash',3],['english_progress','Ingliz tili A1–C1',5],['web_progress','Web dasturlash',2]];const user=JSON.parse(sessionStorage.getItem('currentUser')||'{}');student.textContent=user.name||'Talaba';let complete=false;courses.forEach(([key,name,total])=>{const done=JSON.parse(localStorage.getItem(key)||'[]').length,p=Math.min(100,Math.round(done/total*100));if(p===100)complete=true;progressList.innerHTML+=`<div class="bg-white/10 p-5 rounded-2xl"><div class="flex justify-between mb-3"><b>${name}</b><span class="text-yellow-300">${p}%</span></div><div class="h-3 bg-black/30 rounded-full"><div class="h-3 rounded-full bg-gradient-to-r from-emerald-400 to-cyan-400" style="width:${p}%"></div></div><p class="text-sm text-white/60 mt-3">${done}/${total} dars bajarildi • ${total-done} dars qoldi</p></div>`});if(complete){certificate.classList.remove('locked');status.textContent='Tabriklaymiz! Sertifikatingiz tayyor.';print.disabled=false;print.className='mt-8 bg-emerald-600 text-white px-8 py-4 rounded-xl font-bold';print.onclick=()=>window.print()}</script></body></html>
