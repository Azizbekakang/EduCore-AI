<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masalalar | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#172554,#1e40af);font-family:Segoe UI,sans-serif}.card{background:#ffffff12;border:1px solid #ffffff1c;border-radius:22px;padding:22px}.field{width:100%;background:#ffffff12;border:1px solid #ffffff30;border-radius:10px;padding:11px;color:white;outline:none}</style></head><body class="text-white p-6"><main class="max-w-7xl mx-auto"><header class="text-center mb-8"><a href="index.html" class="text-yellow-300">← Bosh sahifa</a><h1 class="text-5xl font-black text-yellow-300 mt-4">MASALALAR</h1><p class="text-white/70">Admin panelda qo‘shilgan masalalarni yeching</p></header><div class="flex flex-wrap gap-3 mb-6"><input id="search" class="field max-w-xl" placeholder="Masala izlash..."><a href="books/masalalar-kitob.pdf" target="_blank" class="bg-yellow-400 text-black font-bold px-5 py-3 rounded-xl">📘 Masalalar kitobi</a></div><div id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-5"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sample=[{id:'0001',name:'A+B',text:'Ikki sonning yig‘indisini toping.',answer:'',difficulty:'Oson',category:'Matematika'}];function get(){return JSON.parse(localStorage.getItem('masalalar')||'null')||sample}function render(){const term=document.getElementById('search').value.toLowerCase(),items=get().filter(x=>(x.name+' '+x.text+' '+x.category).toLowerCase().includes(term));document.getElementById('grid').innerHTML=items.map((m,i)=>`<article class="card"><span class="text-cyan-300">#${esc(m.id||String(i+1).padStart(4,'0'))}</span><h2 class="text-2xl font-bold mt-2">${esc(m.name)}</h2><p class="text-white/75 my-3">${esc(m.text)}</p><p class="text-sm text-yellow-300">${esc(m.category||'Umumiy')} · ${esc(m.difficulty||'O‘rta')} · ${esc(m.points||'10')} ball</p><button class="bg-cyan-400 text-slate-950 font-bold px-5 py-2 rounded-xl mt-4" onclick="solve('${esc(m.id||i)}')">Yechish</button></article>`).join('')||'<p>Masala topilmadi.</p>'}function solve(id){const m=get().find(x=>String(x.id)===String(id));if(!m)return;const ans=prompt(m.text);if(ans===null)return;alert(m.answer&&ans.trim().toLowerCase()===String(m.answer).trim().toLowerCase()?'To‘g‘ri javob!':'Javob noto‘g‘ri yoki tekshirish javobi kiritilmagan.')}document.getElementById('search').oninput=render;render();</script></body></html>
