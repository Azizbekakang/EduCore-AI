<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masalalar | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#020617,#1e3a8a);font-family:Segoe UI,sans-serif}.card{background:#ffffff12;border:1px solid #ffffff20;backdrop-filter:blur(14px);border-radius:22px}.field{background:#ffffff12;border:1px solid #ffffff2a;color:white;border-radius:12px;padding:12px;outline:0}.modal{background:#0f172af5;backdrop-filter:blur(18px)}</style></head><body class="text-white p-6"><main class="max-w-7xl mx-auto"><header class="text-center mb-7"><a href="index.html" class="text-yellow-300">← Bosh sahifa</a><h1 class="text-5xl font-black text-yellow-300 mt-4">MASALALAR</h1><p class="text-white/60">Masalani bosing — alohida oynada to‘liq yeching</p></header><section class="card p-4 mb-6 flex flex-wrap gap-3"><input id="search" class="field flex-1 min-w-64" placeholder="Nom, mavzu yoki kategoriya bo‘yicha izlash"><select id="difficulty" class="field text-black"><option value="">Barcha qiyinchilik</option><option>Oson</option><option>O‘rta</option><option>Qiyin</option></select><a href="books/masalalar-kitob.pdf" target="_blank" class="bg-yellow-400 text-black font-bold px-5 py-3 rounded-xl">📘 Kitobni yuklash</a></section><section id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></section></main><div id="modal" class="hidden fixed inset-0 z-50 modal overflow-y-auto p-5"><div class="max-w-3xl mx-auto mt-10 card p-7"><button id="close" class="float-right bg-red-600 px-3 py-2 rounded-lg">✕</button><p id="meta" class="text-cyan-300"></p><h2 id="title" class="text-3xl font-black text-yellow-300 my-3"></h2><p id="statement" class="text-lg leading-8 whitespace-pre-line"></p><textarea id="answer" class="field w-full mt-6 min-h-32" placeholder="Yechimingiz yoki javobingiz..."></textarea><button id="submit" class="bg-green-500 text-black font-bold px-6 py-3 rounded-xl mt-3">JAVOBNI YUBORISH</button><p id="result" class="mt-4 font-bold"></p></div></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sample=[{id:'0001',name:'A+B',text:'Ikki sonning yig‘indisini toping.\nKirish: a va b sonlari.\nChiqish: a+b.',answer:'',difficulty:'Oson',category:'Matematika',points:10}];function get(){let a=JSON.parse(localStorage.getItem('masalalar')||'null');return Array.isArray(a)&&a.length?a:sample}let active=null;function render(){const term=$('search').value.toLowerCase(),dif=$('difficulty').value;const a=get().filter(x=>(x.name+' '+x.text+' '+(x.category||'')).toLowerCase().includes(term)&&(!dif||x.difficulty===dif));$('grid').innerHTML=a.map((m,i)=>`<article class="card p-5 hover:scale-[1.02] transition"><span class="text-cyan-300">#${esc(m.id||String(i+1).padStart(4,'0'))}</span><h2 class="text-2xl font-bold mt-2">${esc(m.name)}</h2><p class="text-white/70 my-3 line-clamp-3">${esc(m.text)}</p><div class="text-sm text-yellow-300">${esc(m.category||'Umumiy')} · ${esc(m.difficulty||'O‘rta')} · ${esc(m.points||10)} ball</div><button class="bg-cyan-400 text-slate-950 font-bold px-5 py-2 rounded-xl mt-4" onclick="openProblem('${esc(m.id||i)}')">Masalani ochish</button></article>`).join('')||'<p class="text-white/60">Masala topilmadi.</p>'}window.openProblem=id=>{active=get().find(x=>String(x.id)===String(id));if(!active)return;$('meta').textContent=`#${active.id||''} · ${active.category||'Umumiy'} · ${active.difficulty||'O‘rta'}`;$('title').textContent=active.name;$('statement').textContent=active.text;$('answer').value='';$('result').textContent='';$('modal').classList.remove('hidden')};$('close').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.add('hidden')};$('submit').onclick=()=>{if(!active)return;const value=$('answer').value.trim();if(!value)return $('result').textContent='Javobingizni kiriting.';const ok=active.answer&&value.toLowerCase()===String(active.answer).trim().toLowerCase();$('result').textContent=active.answer?(ok?'✅ To‘g‘ri javob!':'❌ Javob noto‘g‘ri.'):'✅ Javobingiz qabul qilindi.';$('result').className='mt-4 font-bold '+(ok||!active.answer?'text-green-300':'text-red-300')};$('search').oninput=render;$('difficulty').onchange=render;render();</script></body></html>
