<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kutubxona | Talim Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-indigo-600 to-purple-800 min-h-screen p-8 text-white">
  <div class="container mx-auto max-w-7xl">
    <div class="flex flex-wrap justify-between items-center gap-4 mb-8"><a href="index.html" class="text-yellow-300 hover:underline"><i class="fa-solid fa-arrow-left mr-2"></i>Bosh sahifa</a><a href="index.html#kurslar" class="bg-yellow-400 text-black px-5 py-2 rounded-xl font-bold">Kurslar</a></div>
    <h1 class="text-5xl font-bold text-center mb-4 text-yellow-300">KUTUBXONA</h1>
    <p class="text-center text-lg mb-10 text-white/80">Kitobni tanlang, demo ko‘ring yoki manbani oching</p>
    <input id="search" placeholder="Kitob izlash..." class="w-full p-4 rounded-xl bg-white/20 text-white placeholder-white/70 mb-8">
    <div id="bookGrid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  </div>
  <script>
    const books = [
      {title:'Python Dasturlash', icon:'fa-python', demo:'kurs-python.html'},
      {title:'Web Dasturlash', icon:'fa-code', demo:'kurs-web.html'},
      {title:'Ingliz tili A1', icon:'fa-language', demo:'kurs-ingliz.html'},
      {title:'Olimpiada masalalari', icon:'fa-trophy', demo:'olimpiada.html'},
      {title:'Matematika 11', icon:'fa-calculator'}, {title:'Fizika 9', icon:'fa-atom'},
      {title:'Kimyo 10', icon:'fa-flask'}, {title:'IT Asoslari', icon:'fa-computer'},
      {title:'Java Dasturlash', icon:'fa-code'}, {title:'AI Kirish', icon:'fa-robot'},
      {title:'Data Science', icon:'fa-chart-line'}, {title:'Cyber Security', icon:'fa-shield-halved'},
      {title:'Android Dasturlash', icon:'fa-mobile-screen'}, {title:'React JS', icon:'fa-react'},
      {title:'SQL Asoslari', icon:'fa-database'}, {title:'UI/UX Dizayn', icon:'fa-palette'}
    ];
    const grid=document.getElementById('bookGrid');
    function render(term='') {
      grid.innerHTML='';
      books.filter(b=>b.title.toLowerCase().includes(term.toLowerCase())).forEach(b=>{
        const card=document.createElement('div'); card.className='bg-white/10 backdrop-blur-xl p-6 rounded-2xl text-center shadow-xl hover:-translate-y-2 transition';
        card.innerHTML=`<i class="fa-solid ${b.icon} text-5xl mb-4 text-yellow-300"></i><h2 class="text-xl font-bold mb-4">${b.title}</h2><a href="${b.demo || '#'}" ${b.demo?'':'onclick="alert(\'Bu kitob uchun demo tez orada qo‘shiladi.\');return false;"'} class="inline-block bg-yellow-400 text-black px-4 py-2 rounded-xl font-bold hover:bg-yellow-300">${b.demo?'Demo ko‘rish':'Tez orada'}</a>`;
        grid.appendChild(card);
      });
    }
    render(); document.getElementById('search').addEventListener('input',e=>render(e.target.value));
  </script>
</body>
</html>
