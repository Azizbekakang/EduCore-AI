<!DOCTYPE html>
<html lang="uz">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kutubxona | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><style>body{background:radial-gradient(circle at 80% 0,#0e7490,transparent 30%),linear-gradient(135deg,#0f172a,#172554);font-family:Segoe UI,sans-serif}.book{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px)}</style></head>
<body class="min-h-screen text-white p-6 md:p-10"><main class="max-w-7xl mx-auto"><header class="flex flex-wrap justify-between items-center gap-4 mb-12"><a href="index.html" class="text-cyan-300 hover:underline"><i class="fa-solid fa-arrow-left mr-2"></i>Bosh sahifa</a><a href="mavjud-kurslar.html" class="bg-cyan-400 text-slate-900 px-5 py-3 rounded-xl font-bold">Kurslarni ko‘rish</a></header><section class="text-center mb-10"><div class="text-cyan-300 text-5xl mb-4"><i class="fa-solid fa-book-open-reader"></i></div><h1 class="text-5xl md:text-6xl font-black">EduCore kutubxonasi</h1><p class="text-white/65 text-lg mt-3">Bilim uchun tanlangan manbalar va interaktiv demolar</p></section><div class="max-w-2xl mx-auto relative mb-10"><i class="fa-solid fa-magnifying-glass absolute left-5 top-5 text-white/50"></i><input id="search" placeholder="Kitob yoki mavzu izlang..." class="w-full p-4 pl-14 rounded-2xl bg-white/10 border border-white/20 outline-none focus:ring-2 focus:ring-cyan-400 text-white"></div><div id="bookGrid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6"></div></main><script>
const books=[['Python Dasturlash','fa-brands fa-python','kurs-python.html'],['Web Dasturlash','fa-solid fa-code','kurs-web.html'],['Ingliz tili A1–C1','fa-solid fa-language','kurs-ingliz.html'],['Olimpiada masalalari','fa-solid fa-trophy','olimpiada.html'],['Matematika 11','fa-solid fa-calculator'],['Fizika 9','fa-solid fa-atom'],['Kimyo 10','fa-solid fa-flask'],['IT Asoslari','fa-solid fa-computer'],['Java Dasturlash','fa-solid fa-code'],['AI Kirish','fa-solid fa-robot'],['Data Science','fa-solid fa-chart-line'],['Cyber Security','fa-solid fa-shield-halved'],['Android Dasturlash','fa-solid fa-mobile-screen'],['React JS','fa-brands fa-react'],['SQL Asoslari','fa-solid fa-database'],['UI/UX Dizayn','fa-solid fa-palette']];const grid=document.getElementById('bookGrid');function render(q=''){grid.innerHTML='';books.filter(b=>b[0].toLowerCase().includes(q.toLowerCase())).forEach(b=>{const el=document.createElement('article');el.className='book rounded-3xl p-6 hover:-translate-y-2 transition shadow-xl';el.innerHTML=`<div class="w-14 h-14 rounded-2xl bg-cyan-400/20 text-cyan-300 flex items-center justify-center text-2xl mb-5"><i class="${b[1]}"></i></div><h2 class="text-xl font-bold">${b[0]}</h2><p class="text-white/55 text-sm mt-2 mb-6">EduCore tanlangan manbasi</p>${b[2]?`<a href="${b[2]}" class="inline-block bg-cyan-400 text-slate-900 px-4 py-2 rounded-xl font-bold">Demo ko‘rish <i class="fa-solid fa-arrow-right ml-1"></i></a>`:'<span class="inline-block bg-white/10 text-white/50 px-4 py-2 rounded-xl">Tez orada</span>'}`;grid.appendChild(el)})}render();document.getElementById('search').addEventListener('input',e=>render(e.target.value));</script></body></html>
