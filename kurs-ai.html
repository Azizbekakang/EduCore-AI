<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI asoslari | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#111827,#172554);color:#e5e7eb;font-family:Segoe UI,sans-serif}.card{background:#ffffff14;backdrop-filter:blur(12px);border-radius:24px;padding:28px;margin:24px auto;max-width:1000px}.btn{padding:13px 18px;border:0;border-radius:14px;background:#06b6d4;color:#001018;font-weight:700;cursor:pointer}.btn:disabled{cursor:not-allowed;opacity:.9}.selected{outline:3px solid #fff}.correct{background:#22c55e!important;color:#fff}.wrong{background:#ef4444!important;color:#fff}.progress-fill{height:100%;background:#22d3ee;width:0;transition:width .5s}</style></head>
<body class="p-6"><main class="max-w-6xl mx-auto"><header class="text-center mb-12"><a href="mavjud-kurslar.html" class="text-cyan-300">← Kurslar</a><h1 class="text-5xl md:text-6xl font-extrabold text-cyan-300 mt-6">AI ASOSLARI</h1><p class="text-xl mb-6">Sun’iy intellekt, Machine Learning va neural network</p><div class="h-5 bg-gray-800 rounded-full overflow-hidden max-w-2xl mx-auto"><div id="progressFill" class="progress-fill"></div></div><p class="text-2xl mt-3">Bajarilishi: <span id="progressText">0%</span></p></header><div id="lessons"></div></main>
<script>
const lessons=[
{title:'1-dars: AI va uning tarixi',video:'2ePf9rue1Ao',text:'Sun’iy intellekt nima, uning tarixi va kundalik hayotdagi qo‘llanilishini o‘rganing.',questions:[['AI nimani anglatadi?',['Sun’iy intellekt','Internet','Avtomatik indeks'],0],['AI ning maqsadi nima?',['Faqat hisoblash','Aqlli vazifalarni bajarish','Faqat rasm chizish'],1],['Machine Learning nima?',['Mashinaning ma’lumotdan o‘rganishi','Kompyuter ta’miri','Sayt dizayni'],0],['AI ga misol qaysi?',['Ovozli yordamchi','Oddiy qalam','Stol'],0],['Algoritm nima?',['Muammoni yechish qadamlar ketma-ketligi','Rasm','Parol'],0],['Data nima?',['Ma’lumot','Monitor','Kabel'],0],['AI qaysi sohada ishlatiladi?',['Tibbiyotda','Faqat oshxonada','Hech qayerda'],0],['Robot har doim AI hisoblanadimi?',['Yo‘q, faqat aqlli boshqarilsa','Ha, har doim','Faqat rangli bo‘lsa'],0],['Turing testi nimani tekshiradi?',['Mashina aqlini','Internet tezligini','Ekran sifatini'],0],['AI bilan ishlashda nima muhim?',['Sifatli ma’lumot','Faqat tezlik','Tasodifiy javob'],0]]},
{title:'2-dars: Machine Learning asoslari',video:'ukzFI9rgwfU',text:'Ma’lumotlar, model, trening, test va klassifikatsiya tushunchalarini o‘rganing.',questions:[['Model nimadan o‘rganadi?',['Ma’lumotlardan','Faqat videodan','Elektr tokidan'],0],['Training nima?',['Modelni o‘qitish','Modelni o‘chirish','Fayl yuklash'],0],['Test data nima uchun kerak?',['Modelni tekshirish uchun','Rang tanlash uchun','Video ko‘rish uchun'],0],['Label nima?',['Ma’lumotning javobi yoki toifasi','Parol','Kabel'],0],['Classification nimani aniqlaydi?',['Toifani','Internet tezligini','Ekran rangini'],0],['Regression nimani bashorat qiladi?',['Sonli qiymatni','Faqat rangni','Fayl nomini'],0],['Overfitting nima?',['Model treningni yodlab qolishi','Model tez ishlashi','Internet uzilishi'],0],['Feature nima?',['Modelga beriladigan belgi','Dastur oynasi','Video'],0],['Prediction nima?',['Model bashorati','Fayl o‘chirish','Kod ranglash'],0],['Dataset nima?',['Ma’lumotlar to‘plami','Klaviatura','Brauzer'],0]]},
{title:'3-dars: Neural network va Deep Learning',video:'aircAruvnKk',text:'Neyronlar, qatlamlar, aktivatsiya va deep learning qanday ishlashini o‘rganing.',questions:[['Neural network nimaga taqlid qiladi?',['Miya neyronlariga','Printerga','Klaviaturaga'],0],['Deep Learning nimadan foydalanadi?',['Ko‘p qatlamli tarmoqlardan','Faqat HTMLdan','Faqat Excel’dan'],0],['Neuron nima?',['Hisoblash elementi','Rasm fayli','Internet kabeli'],0],['Input layer nima qabul qiladi?',['Kirish ma’lumotlarini','Faqat parolni','Faqat videoni'],0],['Output layer nima beradi?',['Yakuniy natijani','Elektr tokini','Rang palitrasini'],0],['Hidden layer qayerda bo‘ladi?',['Input va output orasida','Brauzerda','Klaviaturada'],0],['Activation function nima qiladi?',['Neyron chiqishini o‘zgartiradi','Faylni o‘chiradi','Internetni yoqadi'],0],['CNN ko‘proq nimada ishlatiladi?',['Tasvirlarni tahlil qilishda','Parol yaratishda','Audio kabelda'],0],['NLP nimani anglatadi?',['Tabiiy tilni qayta ishlash','Yangi login paroli','Tarmoq kabeli'],0],['Modelni yaxshilash uchun nima qilinadi?',['Ko‘proq va sifatli ma’lumot beriladi','Ma’lumot o‘chiriladi','Kompyuter yopiladi'],0]]}
];
const key='ai_progress',progress=JSON.parse(localStorage.getItem(key)||'[]'),answers={};
const box=document.getElementById('lessons');
function render(){box.innerHTML='';lessons.forEach((l,i)=>{const open=i===0||progress.includes(i-1),d=document.createElement('section');d.className='card';d.innerHTML=`<h2 class="text-3xl font-bold mb-5 text-cyan-300">${open?'▶':'🔒'} ${l.title}</h2>${open?`<iframe src="https://www.youtube.com/embed/${l.video}" class="w-full h-72 rounded-2xl mb-6" allowfullscreen></iframe><p class="text-lg mb-8">${l.text}</p><div id="quiz-${i}" class="space-y-5">${l.questions.map((q,j)=>`<div class="bg-white/10 p-5 rounded-2xl"><p class="font-bold text-xl mb-4">${j+1}. ${q[0]}</p><div class="grid md:grid-cols-3 gap-3">${q[1].map((a,k)=>`<button class="btn" data-q="${j}" onclick="choose(${i},${j},${k})">${a}</button>`).join('')}</div></div>`).join('')}</div><div class="flex flex-wrap gap-3 mt-8"><button class="bg-green-500 text-black font-bold px-8 py-4 rounded-xl" onclick="check(${i})">JAVOBNI TEKSHIRISH</button><button id="retry-${i}" class="hidden bg-yellow-400 text-black font-bold px-8 py-4 rounded-xl" onclick="retry(${i})">QAYTA URINISH</button></div><p id="result-${i}" class="mt-5 text-2xl font-bold"></p>`:'<div class="text-center py-20 text-2xl opacity-60">Bu dars oldingi dars tugagandan keyin ochiladi.</div>'}`;box.appendChild(d)})}function choose(l,q,a){(answers[l]??=[])[q]=a;document.querySelectorAll(`#quiz-${l} [data-q="${q}"]`).forEach((b,i)=>b.classList.toggle('selected',i===a))}function check(i){if(!answers[i]||answers[i].length<lessons[i].questions.length||answers[i].some(v=>v===undefined)){document.getElementById('result-'+i).textContent='Avval barcha 10 ta savolga javob bering!';document.getElementById('result-'+i).className='mt-5 text-2xl font-bold text-yellow-300';return}let n=0;lessons[i].questions.forEach((q,j)=>{let s=answers[i][j];if(s===q[2])n++;document.querySelectorAll(`#quiz-${i} [data-q="${j}"]`).forEach((b,k)=>{b.disabled=true;b.classList.remove('selected');if(k===q[2])b.classList.add('correct');else if(k===s)b.classList.add('wrong')})});let p=n*10,r=document.getElementById('result-'+i),retry=document.getElementById('retry-'+i);retry.classList.remove('hidden');if(p>=80){r.textContent=`Ajoyib! ${p}% — dars tugadi, keyingi dars ochildi!`;r.className='mt-5 text-2xl font-bold text-green-400';if(!progress.includes(i)){progress.push(i);localStorage.setItem(key,JSON.stringify(progress));update();setTimeout(render,900)}}else{r.textContent=`Natija: ${p}%. Keyingi dars ochilishi uchun kamida 80% kerak.`;r.className='mt-5 text-2xl font-bold text-red-400'}}function retry(i){answers[i]=[];document.querySelectorAll(`#quiz-${i} button`).forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong','selected')});document.getElementById('result-'+i).textContent='Qayta urinib, barcha savollarga javob bering.';document.getElementById('result-'+i).className='mt-5 text-2xl font-bold text-cyan-300';document.getElementById('retry-'+i).classList.add('hidden')}function update(){let p=Math.round(progress.length/lessons.length*100);document.getElementById('progressText').textContent=p+'%';document.getElementById('progressFill').style.width=p+'%'}render();update();
</script></body></html>
