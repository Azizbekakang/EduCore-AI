<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI asoslari | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#111827,#172554);color:#e5e7eb;font-family:Segoe UI,sans-serif}.card{background:#ffffff14;backdrop-filter:blur(12px);border-radius:24px;padding:28px;margin:24px auto;max-width:1000px}.btn{padding:13px 18px;border:0;border-radius:14px;background:#06b6d4;color:#001018;font-weight:700;cursor:pointer}.selected{outline:3px solid white}.correct{background:#22c55e!important;color:white}.wrong{background:#ef4444!important;color:white}.bar{height:20px;background:#1f2937;border-radius:99px;overflow:hidden}.fill{height:100%;background:#22d3ee;width:0;transition:.4s}.video{width:100%;height:360px;border:0;border-radius:18px;margin:8px 0 24px}</style></head><body class="p-6"><main class="max-w-6xl mx-auto"><header class="text-center mb-12"><a href="mavjud-kurslar.html" class="text-cyan-300">← Kurslar</a><h1 class="text-5xl font-black text-cyan-300 mt-6">AI ASOSLARI</h1><p class="text-xl">Har bir darsda 10 ta savol. Keyingi dars faqat 80% dan keyin ochiladi.</p><div class="bar max-w-2xl mx-auto mt-6"><div id="fill" class="fill"></div></div><p class="text-2xl mt-3">Bajarilishi: <b id="percent">0%</b></p></header><div id="lessons"></div></main><script>
const lessons=[{title:'AI va uning tarixi',video:'2ePf9rue1Ao',text:'Sun’iy intellekt, uning tarixi va qo‘llanilishi.'},{title:'Machine Learning asoslari',video:'ukzFI9rgwfU',text:'Model, ma’lumot, trening va test tushunchalari.'},{title:'Neural network va Deep Learning',video:'aircAruvnKk',text:'Neyron, qatlam va deep learning asoslari.'}];const qs=[['AI nimani anglatadi?','Sun’iy intellekt'],['AI maqsadi nima?','Aqlli vazifalarni bajarish'],['Machine Learning nima?','Ma’lumotdan o‘rganish'],['Algoritm nima?','Qadamlar ketma-ketligi'],['Data nima?','Ma’lumot'],['AI qayerda ishlatiladi?','Tibbiyotda'],['Model nimadan o‘rganadi?','Ma’lumotdan'],['Training nima?','Modelni o‘qitish'],['Classification nimani aniqlaydi?','Toifani'],['Dataset nima?','Ma’lumotlar to‘plami']];const key='ai_progress_v2',done=JSON.parse(localStorage.getItem(key)||'[]'),answers={},wrong=['Internet','Faqat rasm','Kompyuter ta’miri'];const lessonsEl=document.getElementById('lessons');function render(){lessonsEl.innerHTML='';lessons.forEach((l,i)=>{const open=i===0||done.includes(i-1),d=document.createElement('section');d.className='card '+(open?'':'opacity-50');d.innerHTML='<h2 class="text-3xl font-bold text-cyan-300 mb-4">'+(open?'▶':'🔒')+' '+(i+1)+'-dars: '+l.title+'</h2>'+(open?'<iframe class="video" src="https://www.youtube.com/embed/'+l.video+'" title="'+l.title+' video darsi" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><p class="text-lg mb-6">'+l.text+'</p><div id="quiz'+i+'">'+qs.map((q,j)=>'<div class="bg-white/10 p-5 rounded-2xl mb-4"><p class="font-bold text-xl mb-3">'+(j+1)+'. '+q[0]+'</p><div class="grid md:grid-cols-3 gap-3">'+[q[1],wrong[j%3],wrong[(j+1)%3]].map((a,k)=>'<button class="btn" data-q="'+j+'" onclick="pick('+i+','+j+','+k+')">'+a+'</button>').join('')+'</div></div>').join('')+'</div><button class="bg-green-500 text-black font-bold px-7 py-3 rounded-xl" onclick="check('+i+')">JAVOBNI TEKSHIRISH</button><button id="retry'+i+'" class="hidden bg-yellow-400 text-black font-bold px-7 py-3 rounded-xl ml-2" onclick="retry('+i+')">QAYTA URINISH</button><p id="result'+i+'" class="mt-5 text-xl font-bold"></p>':'<div class="text-center py-20 text-2xl">Avval oldingi darsni kamida 80% bilan tugating.</div>');lessonsEl.appendChild(d)})}function pick(l,q,a){(answers[l]??=[])[q]=a;document.querySelectorAll('#quiz'+l+' [data-q="'+q+'"]').forEach((b,k)=>b.classList.toggle('selected',k===a))}function check(i){const r=document.getElementById('result'+i);if(!answers[i]||answers[i].length!==10||answers[i].some(x=>x===undefined)){r.textContent='Avval barcha 10 ta savolga javob bering!';r.className='mt-5 text-xl font-bold text-yellow-300';return}let score=0;qs.forEach((q,j)=>{const s=answers[i][j];if(s===0)score++;document.querySelectorAll('#quiz'+i+' [data-q="'+j+'"]').forEach((b,k)=>{b.disabled=true;b.classList.remove('selected');if(k===0)b.classList.add('correct');if(k===s&&s!==0)b.classList.add('wrong')})});const p=Math.min(100,score*10);document.getElementById('retry'+i).classList.remove('hidden');if(p>=80){if(!done.includes(i))done.push(i);done.sort((a,b)=>a-b);localStorage.setItem(key,JSON.stringify(done));r.textContent='Ajoyib! '+p+'%. Keyingi dars ochildi.';r.className='mt-5 text-xl font-bold text-green-400';update();setTimeout(render,700)}else{r.textContent='Natija: '+p+'%. 80% kerak. Qayta urinib ko‘ring.';r.className='mt-5 text-xl font-bold text-red-400'}}function retry(i){answers[i]=[];document.querySelectorAll('#quiz'+i+' button').forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong','selected')});document.getElementById('result'+i).textContent='0% dan qayta boshlandi.';document.getElementById('retry'+i).classList.add('hidden')}function update(){const p=Math.min(100,Math.round(done.length/lessons.length*100));percent.textContent=p+'%';fill.style.width=p+'%'}render();update();</script></body></html>
