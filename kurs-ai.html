<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI asoslari | EduCore AI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:linear-gradient(135deg,#172554,#581c87);color:#f5f3ff;font-family:Segoe UI,sans-serif}.lesson{background:#ffffff12;border:1px solid #ffffff20;border-radius:24px;padding:28px;margin:20px 0}.btn{background:#c084fc;color:#24103d;padding:12px 22px;border-radius:12px;font-weight:700}</style></head><body class="p-6"><main class="max-w-5xl mx-auto"><a href="mavjud-kurslar.html" class="text-purple-200">← Barcha kurslar</a><h1 class="text-5xl font-black text-center mt-8">AI asoslari</h1><p class="text-center text-xl text-purple-100/70 mt-3">Sun’iy intellekt olamiga amaliy kirish</p><div id="lessons" class="mt-10"></div></main><script>const topics=['AI nima va qanday ishlaydi?','Ma’lumotlar va algoritmlar','Machine Learning asoslari','Neural network tushunchasi','Generative AI va chatbotlar','AI xavfsizligi va etika','Yakuniy amaliy loyiha'];let done=JSON.parse(localStorage.getItem('ai_progress')||'[]');function draw(){lessons.innerHTML=topics.map((t,i)=>`<article class="lesson"><h2 class="text-2xl font-bold">${done.includes(i)?'✅':'🤖'} ${i+1}. ${t}</h2><p class="text-purple-100/70 mt-3">Qisqa dars, real misol va mustahkamlash topshirig‘i.</p><button class="btn mt-5" onclick="finish(${i})" ${done.includes(i)?'disabled':''}>${done.includes(i)?'Bajarildi':'Darsni yakunlash'}</button></article>`).join('')}function finish(i){if(!done.includes(i)){done.push(i);localStorage.setItem('ai_progress',JSON.stringify(done));draw()}}draw()</script></body></html>
