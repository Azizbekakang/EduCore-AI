<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edu-AI | Kirish</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <style>
    body {
      background: linear-gradient(rgba(0,0,0,.8), rgba(17,24,39,.95)),
                  url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=2000') center/cover fixed;
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }
    .glass { background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="glass max-w-md w-full rounded-3xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-yellow-400 to-pink-500 text-black text-2xl font-black mb-4">AI</div>
      <h1 class="text-3xl font-black text-yellow-300">Edu-AI</h1>
      <p class="text-gray-300 mt-2">Kirish va ta’limni boshlang</p>
    </div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm text-gray-300 mb-2">Ism</label>
        <input id="name" type="text" required placeholder="Ismingizni kiriting" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-2">Email</label>
        <input id="email" type="email" required placeholder="example@mail.com" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-2">Parol</label>
        <input id="password" type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>

      <button type="submit" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-xl hover:bg-yellow-300 transition">
        <i class="fa-solid fa-right-to-bracket mr-2"></i>Kirish
      </button>
    </form>

    <p id="message" class="mt-5 text-sm text-red-300 hidden"></p>

    <div class="mt-6 text-center text-sm text-gray-300">
      Akkount yo‘qmi? <a href="index.html" class="text-yellow-300 hover:underline">Bosh sahifaga qaytish</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!name || !email || !password) {
        message.textContent = 'Iltimos, hamma maydonlarni to‘ldiring.';
        message.classList.remove('hidden');
        return;
      }

      const user = { name, email, password };
      localStorage.setItem('currentUser', JSON.stringify(user));
      sessionStorage.setItem('currentUser', JSON.stringify(user));

      message.textContent = 'Muvaffaqiyatli kirdingiz!';
      message.classList.remove('hidden');
      message.classList.remove('text-red-300');
      message.classList.add('text-green-300');

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 800);
    });
  </script>
</body>
</html>
